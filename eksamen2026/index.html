/* ==========================================================================
   EKSAMEN VÅREN 2026 – visuell identitet
   Mørk natt-flate (ink) og lys papirflate (paper). Én signalfarge for reisen.
   Poppins for informasjon, Big Shoulders Display for datoer og overskrifter.
   ========================================================================== */
:root {
  --ink: #0d1110;
  --ink-2: #161c1a;
  --paper: #f3efe7;
  --paper-2: #e8e2d6;
  --signal: #ff5a1f;
  --amber: #f2c14e;
  --sea: #5ec2a8;
  --bone: #e8e1d3;
  --f-sans: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-disp: "Big Shoulders Display", "Poppins", "Arial Narrow", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --top: 12vh;
  --side: 6vw;
  --ease: cubic-bezier(.2, .7, .1, 1);
  color-scheme: dark;
}
body[data-tema="dark"] {
  --bg: var(--ink); --fg: var(--paper);
  --soft: rgba(243, 239, 231, .84); --muted: rgba(243, 239, 231, .6);
  --line: rgba(243, 239, 231, .15); --line-2: rgba(243, 239, 231, .3);
  --track: rgba(243, 239, 231, .2); --ph: var(--amber); --ph-bg: rgba(242, 193, 78, .08);
  --ok: var(--sea);
}
body[data-tema="light"] {
  --bg: var(--paper); --fg: var(--ink);
  --soft: rgba(13, 17, 16, .82); --muted: rgba(13, 17, 16, .58);
  --line: rgba(13, 17, 16, .13); --line-2: rgba(13, 17, 16, .28);
  --track: rgba(13, 17, 16, .2); --ph: #9a6a00; --ph-bg: rgba(154, 106, 0, .07);
  --ok: #1f7a64;
}

*, *::before, *::after { box-sizing: border-box; }
html { font-size: clamp(14px, calc(.55vw + .6vh + 4px), 30px); -webkit-text-size-adjust: 100%; }
html, body { margin: 0; height: 100%; }
body {
  background-color: var(--bg); color: var(--fg);
  font-family: var(--f-sans); font-weight: 400; line-height: 1.45;
  overflow: hidden; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  transition: background-color .9s ease, color .9s ease;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
a { color: inherit; }
kbd { font: 500 .78em var(--f-mono); border: 1px solid var(--line-2); border-radius: 4px; padding: .05em .4em; }
code { font: 500 .85em var(--f-mono); }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.mut { color: var(--muted); }

#app { position: fixed; inset: 0; overflow: hidden; }
#parallax, #nodes, #stage { position: absolute; inset: 0; }
#parallax { z-index: 1; pointer-events: none; }
#track { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
#nodes { z-index: 3; pointer-events: none; }
#stage { z-index: 4; pointer-events: none; }
#hud { z-index: 6; }

/* ---------------- Ruta ---------------- */
.rt-base { fill: none; stroke: var(--track); stroke-width: 1.5px; transition: stroke .9s; }
.rt-prog { fill: none; stroke: var(--signal); stroke-width: 3px; stroke-linecap: round; }
.rt-lane { fill: none; stroke-width: 3px; stroke-linecap: round; }
.l-mp { stroke: var(--sea); } .l-pr { stroke: var(--bone); } .l-mu { stroke: var(--amber); }
.rt-cross { fill: none; stroke: var(--line-2); stroke-width: 1.5px; }
body.is-overview .rt-base { stroke: var(--line-2); }

/* ---------------- Stoppesteder ---------------- */
.stn, .tick, .par, .lane-tag, .wa { position: absolute; left: 0; top: 0; will-change: transform; }
.stn { pointer-events: auto; width: 0; height: 0; }
.stn i {
  position: absolute; left: -.42rem; top: -.42rem; width: .84rem; height: .84rem; border-radius: 50%;
  background: var(--bg); border: 2px solid var(--line-2); transition: background .4s, border-color .4s, transform .5s var(--ease);
}
.stn::before { content: ""; position: absolute; left: -1.2rem; top: -1.2rem; width: 2.4rem; height: 2.4rem; border-radius: 50%; }
.stn.done i { background: var(--signal); border-color: var(--signal); }
.stn.stor i { transform: scale(1.35); }
.stn.cur i { transform: scale(1.6); background: var(--bg); border-color: var(--signal); border-width: 3px; }
.stn.cur::after {
  content: ""; position: absolute; left: -1rem; top: -1rem; width: 2rem; height: 2rem; border-radius: 50%;
  border: 1px solid var(--signal); animation: puls 2.4s ease-out infinite;
}
@keyframes puls { from { transform: scale(.6); opacity: .9; } to { transform: scale(2.3); opacity: 0; } }
.stn.hl i { border-color: var(--signal); box-shadow: 0 0 0 .3rem rgba(255, 90, 31, .28); }
.stn.dim { opacity: .2; }
.stn-d, .stn-t { position: absolute; left: 1.1rem; white-space: nowrap; pointer-events: none; transition: opacity .3s; }
.stn.o-h .stn-d { top: -2.3rem; left: .7rem; }
.stn.o-h .stn-t { top: -1.35rem; left: .7rem; }
.stn-d { top: -1.05rem; font: 800 .8rem/1 var(--f-disp); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.stn-t { top: -.1rem; font: 500 .7rem/1.2 var(--f-sans); color: var(--muted); max-width: 14rem; }
.stn.cur .stn-d, .stn.cur .stn-t { opacity: 0; }
.stn-t { opacity: 0; }
.kartfri #nodes:not([data-lod="far"]) .stn-t { opacity: 1; }
#nodes.kal .stn .stn-d, body[data-kap="4"] .stn:not(:hover) .stn-d, body[data-kap="0"] #nodes[data-lod="near"] .stn:not(:hover) .stn-d { opacity: 0; }
#nodes[data-lod="far"] .stn-d, #nodes[data-lod="far"] .stn-t { opacity: 0; }
.kartfri #nodes[data-lod="mid"] .stn-t { font-size: .62rem; }
.kartfri #nodes[data-lod="far"] .stn.stor .stn-d { opacity: 1; }
#nodes[data-lod="far"] .stn i { width: .6rem; height: .6rem; left: -.3rem; top: -.3rem; border-width: 1.5px; }
.stn:hover .stn-d, .stn:hover .stn-t { opacity: 1 !important; color: var(--fg); }
.hud-rolle[hidden] { display: none !important; }

/* Maidagene */
.tick { pointer-events: none; width: 0; height: 0; }
.tick i { position: absolute; left: -1px; top: -.35rem; width: 2px; height: .7rem; background: var(--line-2); }
.tick.ex i { background: var(--signal); height: 1.1rem; top: -.55rem; width: 3px; left: -1.5px; }
.tick.we { opacity: .45; }
.tk-d { position: absolute; top: .8rem; left: 0; translate: -50% 0; font: 800 .95rem/1 var(--f-disp); }
.tk-w { position: absolute; top: 1.85rem; left: 0; translate: -50% 0; font: 500 .52rem/1 var(--f-sans); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.tk-f { position: absolute; bottom: 1.1rem; left: 0; translate: -50% 0; width: var(--tw, 5.6rem); display: flex; flex-direction: column; gap: .2rem; font: 500 .56rem/1.2 var(--f-sans); color: var(--soft); text-align: center; opacity: 0; transition: opacity .5s; }
.tk-f em { font-style: normal; color: var(--muted); }
#nodes.kal .tick { pointer-events: auto; }
#nodes.kal .tk-f { opacity: 1; }
#nodes.kal .tick::before { content: ""; position: absolute; left: calc(var(--tw) / -2); top: -8rem; width: var(--tw); height: 11rem; }
.tick.sel .tk-f { color: var(--fg); font-weight: 600; }
.tick.sel .tk-d { color: var(--signal); }
.tick.sel i { background: var(--signal); height: 1.6rem; top: -.8rem; }
#nodes:not([data-lod="near"]):not(.kal) .tick { opacity: 0; }
#nodes.kal .tk-d { font-size: 1.1rem; }

.par { font: 900 24vw/0.8 var(--f-disp); text-transform: uppercase; white-space: nowrap; translate: -50% -50%; color: transparent; -webkit-text-stroke: 1px var(--line); opacity: 0; transition: opacity .8s; }
body[data-kap="1"] .pk-1, body[data-kap="2"] .pk-2, body[data-kap="6"] .pk-6 { opacity: .9; }
body[data-tema="light"] .par { -webkit-text-stroke-color: rgba(13, 17, 16, .08); }
.par-v { font-size: 16vw; }
body.is-overview .par, .kartfri .par { opacity: 0; }
.lane-tag { font: 800 .8rem/1 var(--f-disp); letter-spacing: .08em; text-transform: uppercase; translate: 1rem -1.6rem; white-space: nowrap; transition: opacity .4s; }
.lane-tag.l-mp { color: var(--sea); } .lane-tag.l-mu { color: var(--amber); } .lane-tag.l-pr { color: var(--bone); }
#nodes[data-lod="far"] .lane-tag, body[data-kap="3"] .lane-tag { opacity: 0; }

/* ---------------- Scener ---------------- */
.scene {
  position: absolute; inset: 0; pointer-events: none;
  opacity: 0; transform: translate3d(var(--ex, 0), var(--ey, 0), 0);
}
.scene.in { opacity: 1; transform: none; transition: opacity .55s ease, transform 1s var(--ease); }
.scene.out { opacity: 0; transform: translate3d(var(--lx, 0), var(--ly, 0), 0); transition: opacity .32s ease, transform .45s ease-in; }
.scene button, .scene a, .scene input { pointer-events: auto; }
.scene .wa > * { translate: -50% -50%; }
.scene .wa.up > * { translate: 0 calc(-100% - 2rem); }

[data-so] { opacity: 0; transition: opacity .7s ease; }
[data-so].on { opacity: 1; }
[data-s] { opacity: 0; transform: translate3d(0, 1.3rem, 0); transition: opacity .5s ease, transform .85s var(--ease); }
[data-s].on { opacity: 1; transform: none; }
[data-s] li, [data-s] .ta-n { transition: opacity .5s ease, transform .8s var(--ease); transition-delay: calc(var(--i, 0) * 70ms + 120ms); }
[data-s]:not(.on) li { opacity: 0; transform: translate3d(0, .8rem, 0); }
[data-flip] { opacity: 0; }
[data-flip].flipped { opacity: 1; }

.sc { position: absolute; display: flex; flex-direction: column; justify-content: center; gap: 2.2vh; }
.sc { justify-content: safe center; }
.lay-v-left .sc { left: calc(var(--tx) + 5.5vw); right: var(--side); top: var(--top); bottom: 11vh; }
.lay-v-right .sc { left: var(--side); right: calc(100vw - var(--tx) + 5.5vw); top: var(--top); bottom: 11vh; }
.lay-h-bottom .sc { left: var(--side); right: var(--side); top: var(--top); bottom: calc(100vh - var(--ty) + 7.5vh); justify-content: safe flex-end; }
.lay-lanes .sc { left: var(--side); right: var(--side); top: var(--top); bottom: calc(100vh - var(--lt) + 3.5vh); justify-content: safe flex-end; }
.lay-hump .sc { left: var(--side); right: var(--side); top: var(--top); bottom: calc(100vh - var(--ty) + 6vh); justify-content: safe flex-end; }
.sc header { display: flex; flex-direction: column; gap: 1.1rem; }
.lay-cross .sc, .lay-center .sc { inset: var(--top) var(--side) 11vh; }
.utf { --top: 18vh; }

.eyebrow { margin: 0; display: flex; align-items: center; gap: .7rem; flex-wrap: wrap; font: 600 .72rem/1.2 var(--f-sans); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.lede { margin: 0; font-weight: 300; font-size: 1.22rem; line-height: 1.5; color: var(--soft); max-width: 40ch; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; }
.sc h2 { font: 800 4.6rem/.9 var(--f-disp); text-transform: uppercase; letter-spacing: .005em; max-width: 18ch; }

.tag { display: inline-flex; align-items: center; gap: .4em; font: 600 .56rem/1 var(--f-sans); letter-spacing: .12em; text-transform: uppercase; padding: .38em .62em .34em; border-radius: 2px; white-space: nowrap; vertical-align: middle; }
.t-nasjonal { background: var(--fg); color: var(--bg); }
.t-lokal { border: 1px dashed var(--ph); color: var(--ph); }
.t-tips { border: 1px solid var(--line-2); color: var(--muted); }
.tag em { font-style: normal; color: var(--signal); }
.t-nasjonal em { color: var(--signal); }
.eyebrow .tag { letter-spacing: .12em; }

.ph { display: inline; border: 1.5px dashed var(--ph); background: var(--ph-bg); border-radius: 3px; padding: 0 .3em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.ph b { white-space: nowrap; font: 600 max(.5em, 9px)/1 var(--f-sans); letter-spacing: .1em; text-transform: uppercase; color: var(--ph); margin-right: .45em; vertical-align: .2em; }
.ph b:only-child { margin-right: 0; }

.src { display: block; margin-top: .45rem; font-size: .66rem; line-height: 1.35; color: var(--muted); text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; max-width: 46ch; }
.src::before { content: "Kilde · "; text-decoration: none; display: inline; }
.src:hover { color: var(--fg); }
p .src, .lede .src { display: inline; margin: 0 0 0 .3em; }

.fact { border-left: 2px solid var(--fg); padding: .2rem 0 .2rem 1.3rem; display: flex; flex-direction: column; gap: .6rem; align-items: flex-start; }
.fact p { margin: 0; font-size: 1rem; line-height: 1.5; }

.pts { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 1.2rem 2.6vw; }
.pts li { border-top: 1px solid var(--line-2); padding-top: .8rem; display: flex; flex-direction: column; gap: .5rem; align-items: flex-start; }
.pts p { margin: 0; font-size: .95rem; line-height: 1.45; }

.btn { display: inline-flex; align-items: center; gap: .6rem; font: 600 .78rem/1 var(--f-sans); letter-spacing: .04em; padding: .8rem 1.2rem; border: 1.5px solid var(--fg); border-radius: 999px; transition: background .2s, color .2s; }
.btn:hover, .btn[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.lnk { font-weight: 600; font-size: .78rem; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--signal); }

/* ---------------- Prolog ---------------- */
.pr-year { display: flex; font: 900 min(44vw, 80vh)/.76 var(--f-disp); letter-spacing: -.01em; color: var(--fg); }
.pr-year.on span, .pr-year span { display: inline-block; transform: translate3d(0, 18%, 0); opacity: 0; transition: transform 1.2s var(--ease), opacity .8s ease; transition-delay: calc(var(--i) * 110ms + 200ms); }
.pr-year.on span { transform: none; opacity: 1; }
.pr-title h1 { font: 900 min(10.5vw, 19vh)/.84 var(--f-disp); text-transform: uppercase; margin: 1.2rem 0 1.4rem; }
.pr-sub { margin: 0; font-weight: 300; font-size: 1.35rem; color: var(--soft); }
.pr-q { width: min(62vw, 48rem); }
.pr-qt { margin: 1.4rem 0 0; font: 500 3.3rem/1.12 var(--f-sans); letter-spacing: -.02em; }
.pr-qt em { font-style: normal; color: var(--signal); }
.pr-hint { position: absolute; left: 50%; bottom: 10vh; translate: -50% 0; margin: 0; font-size: .74rem; color: var(--muted); white-space: nowrap; }

/* ---------------- Kart ---------------- */
.kt-head { position: absolute; left: var(--side); top: var(--top); display: flex; flex-direction: column; gap: 1.2rem; }
.kt-head h2 { font: 800 3.6rem/.92 var(--f-disp); text-transform: uppercase; }
.kt-lab { display: flex; flex-direction: column; gap: .15rem; padding: .3rem .4rem; width: max-content; max-width: 15rem; }
.scene .wa > .kt-lab.pos-r { translate: 1.2rem -50%; }
.scene .wa > .kt-lab.pos-b { translate: -50% 1.3rem; text-align: center; align-items: center; }
.scene .wa > .kt-lab.pos-t { translate: -50% calc(-100% - 1.3rem); text-align: center; align-items: center; }
.scene .wa > .kt-lab.pos-l { translate: calc(-100% - 1.2rem) -50%; text-align: right; align-items: flex-end; }
.kt-lab .nr { font: 900 2.4rem/.9 var(--f-disp); color: var(--signal); }
.kt-lab .nm { font-weight: 600; font-size: .9rem; line-height: 1.2; }
.kt-lab .pe { font-size: .68rem; color: var(--muted); }
.kt-lab:hover .nm { text-decoration: underline; text-decoration-color: var(--signal); text-underline-offset: 3px; }
.kt-legend { position: absolute; left: var(--side); bottom: 11vh; display: flex; gap: 1.6rem; font-size: .72rem; color: var(--muted); }
.kt-legend i { display: inline-block; width: 1.4rem; height: 3px; margin-right: .5rem; vertical-align: middle; }

/* ---------------- Portal ---------------- */
.po { justify-content: flex-end; }
.lay-v-left .po { justify-content: center; }
.po-nr {
  position: absolute; z-index: -1; right: -3vw; bottom: -6vh;
  font: 900 min(46vw, 80vh)/.75 var(--f-disp); color: transparent; -webkit-text-stroke: 1.5px var(--line-2);
}
.lay-lanes .po-nr, .lay-h-bottom .po-nr { bottom: auto; top: -4vh; }
.po-body { display: flex; flex-direction: column; gap: 1.6rem; }
.sc .po-h { font: 900 8.4rem/.82 var(--f-disp); max-width: 14ch; }
.po-route { list-style: none; margin: 1rem 0 0; padding: 0; display: flex; flex-wrap: wrap; position: relative; max-width: 70rem; }
.po-route li { position: relative; padding: 1.4rem 1.6rem 0 0; }
.po-route li::before { content: ""; position: absolute; top: .38rem; left: 0; right: 0; height: 1.5px; background: var(--line-2); }
.po-route button { display: flex; flex-direction: column; gap: .5rem; font-size: .8rem; font-weight: 500; max-width: 10rem; }
.po-route button i { position: absolute; top: 0; left: 0; width: .8rem; height: .8rem; border-radius: 50%; border: 2px solid var(--fg); background: var(--bg); }
.po-route button:hover span { text-decoration: underline; text-decoration-color: var(--signal); text-underline-offset: 3px; }

/* ---------------- Milepæler ---------------- */
.mi-head { display: flex; flex-direction: column; gap: 1rem; }
.mi-when { font: 800 1.5rem/1 var(--f-disp); letter-spacing: .02em; color: var(--signal); }
.mi-when .ph { font-size: .62em; letter-spacing: 0; }
.mi-cols { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, .8fr); gap: 4vw; align-items: start; margin-top: 1vh; }
.cl-top { display: flex; justify-content: space-between; align-items: baseline; font-size: .72rem; }
.cl-lbl { font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.cl-n b { font: 800 1.2rem var(--f-disp); color: var(--signal); }
.cl-bar { height: 2px; background: var(--line); margin: .55rem 0 .2rem; }
.cl-bar i { display: block; height: 100%; background: var(--signal); transition: width .5s var(--ease); }
.cl ul { list-style: none; margin: 0; padding: 0; }
.cl-it { width: 100%; display: grid; grid-template-columns: 1.3rem 1fr auto; gap: 1rem; align-items: center; padding: .72rem 0; border-bottom: 1px solid var(--line); font-size: .95rem; line-height: 1.4; }
.cl-box { width: 1.15rem; height: 1.15rem; border: 1.5px solid var(--line-2); border-radius: 3px; position: relative; transition: background .25s, border-color .25s; }
[aria-pressed="true"] > .cl-box { background: var(--signal); border-color: var(--signal); }
[aria-pressed="true"] > .cl-box::after { content: ""; position: absolute; left: .34rem; top: .1rem; width: .3rem; height: .6rem; border: solid var(--bg); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.cl-it[aria-pressed="true"] .cl-tx { color: var(--muted); }
.cl.full .cl-top::after { content: "Klart"; }
.cl-it:hover .cl-box { border-color: var(--fg); }

/* Ny ordning */
.ny { gap: 3.4vh; }
.ny-h { font-size: 3rem !important; }
.ny-lines { display: flex; flex-direction: column; gap: 2.4vh; }
.ny-row { display: flex; flex-direction: column; gap: .2rem; }
.ny-for { text-decoration: none; font-size: 1.05rem; color: var(--muted); }
.ny-for span { position: relative; }
.ny-for span::after { content: ""; position: absolute; left: -.2em; right: -.2em; top: 55%; height: 2px; background: var(--signal); transform: scaleX(0); transform-origin: left; transition: transform .7s var(--ease) .45s; }
.ny-row.on .ny-for span::after { transform: scaleX(1); }
.ny-na { font: 900 6.2rem/.86 var(--f-disp); text-transform: uppercase; }
.ny-row:nth-child(3) .ny-na { font: 600 2.6rem/1.1 var(--f-sans); text-transform: none; letter-spacing: -.02em; max-width: 24ch; }
.ny-foot { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem 3vw; max-width: 64rem; font-size: .92rem; }
.ny-foot p { margin: 0; }
.ny-foot .src { margin: 0; }

/* Teknisk */
.tek-cols { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 4vw; align-items: center; }
.dev { width: 100%; max-height: 38vh; overflow: visible; }
.dev * { fill: none; stroke: var(--line-2); stroke-width: 2; transition: stroke .4s, fill .4s; }
.dev .dv-skjerm, .dev .dv-base { stroke: var(--fg); }
.dev .dv-seb { stroke: none; }
.dev .dv-seb.on { fill: rgba(255, 90, 31, .12); }
.dev .on, .dev .on * { stroke: var(--signal); }
.dev .dv-test path { stroke-dasharray: 200; stroke-dashoffset: 200; transition: stroke-dashoffset .9s var(--ease); }
.dev .dv-test.on path { stroke-dashoffset: 0; }
.dev text { stroke: none; fill: var(--muted); font: 600 15px var(--f-sans); letter-spacing: .06em; }
.dev text.on { fill: var(--signal); }
.tek-status { margin: .8rem 0 0; font: 800 1.4rem var(--f-disp); text-transform: uppercase; letter-spacing: .04em; }
.tek-ok { display: none; color: var(--signal); }
.tek-no { color: var(--muted); }
.klar .tek-ok { display: inline; } .klar .tek-no { display: none; }
.tek-list { list-style: none; margin: 0; padding: 0; }
.tek-it { width: 100%; display: grid; grid-template-columns: 1.3rem 1fr auto; gap: 1rem; align-items: center; padding: .65rem 0; border-bottom: 1px solid var(--line); }
.tek-tx > strong { display: block; font-weight: 600; font-size: .95rem; }
.tek-tx > small { display: block; font-size: .78rem; color: var(--muted); line-height: 1.4; }
.tek h2 { font-size: 3.6rem; max-width: 22ch; }
.tek .lede { font-size: 1.05rem; max-width: 52ch; }
.tek-dev { display: flex; flex-direction: column; gap: 1.2rem; }
.tek-dev .fact p { font-size: .9rem; }
.dev { max-height: 27vh; }

/* Standpunkt */
.sp h2 { font-size: 3.8rem; }
.sp-rows { display: flex; flex-direction: column; gap: 2.4vh; margin-top: 0; }
.sp-row { display: grid; grid-template-columns: 15rem 1fr; column-gap: 3vw; row-gap: .3rem; align-items: center; }
.sp-lbl { margin: 0; font-weight: 600; font-size: 1rem; line-height: 1.3; }
.sp-line { position: relative; height: 3.2rem; }
.sp-line::before { content: ""; position: absolute; left: 0; right: 0; top: 2.3rem; height: 1.5px; background: var(--line-2); }
.sp-mk { position: absolute; top: 0; translate: -50% 0; display: flex; flex-direction: column; align-items: center; gap: .6rem; white-space: nowrap; }
.sp-mk:first-child[style*="left:0%"] { translate: 0 0; align-items: flex-start; }
.sp-mk[style*="left:100%"] { translate: -100% 0; align-items: flex-end; }
.sp-mk em { font-style: normal; font-size: .72rem; color: var(--muted); order: -1; }
.sp-mk i { width: .7rem; height: .7rem; border-radius: 50%; background: var(--bg); border: 2px solid var(--fg); margin-top: .1rem; }
.sp-mk.frist em { color: var(--signal); font-weight: 600; }
.sp-mk.frist i { background: var(--signal); border-color: var(--signal); width: 1rem; height: 1rem; margin-top: -.05rem; }
.sp-hva { grid-column: 2; margin: 0; font-size: .92rem; color: var(--soft); }
.sp-foot { display: grid; grid-template-columns: auto 1fr 1fr; gap: 1.2rem 2.4vw; align-items: start; }
.sp-foot > p { margin: 0; font-size: .92rem; }

/* ---------------- Trekket ---------------- */
.tk { gap: 2.4vh; }
.tk-date { display: flex; align-items: baseline; gap: 2vw; font: 900 min(19vw, 30vh)/.78 var(--f-disp); text-transform: uppercase; }
.tk-date span:first-child { color: var(--signal); }
.tk-row { display: flex; gap: 3vw; align-items: baseline; }
.tk-kl { font: 500 2.2rem/1 var(--f-mono); color: var(--signal); white-space: nowrap; }
.tk-count { display: flex; align-items: center; gap: 1.2rem; }
.tk-count b { font: 900 6rem/.8 var(--f-disp); }
.tk-count span { font-size: .95rem; line-height: 1.3; color: var(--soft); }
.tk .pts { max-width: 74rem; }

/* ---------------- Perioden i tall ---------------- */
.ta { gap: 4vh; }
.ta-period { font: 900 min(15vw, 28vh)/.8 var(--f-disp); text-transform: uppercase; color: var(--signal); }
.ta-nums { display: flex; align-items: flex-end; gap: 5vw; flex-wrap: wrap; }
.ta-n { display: flex; flex-direction: column; gap: .5rem; max-width: 22rem; }
.ta-n b { font: 900 7rem/.82 var(--f-disp); font-variant-numeric: tabular-nums; }
.ta-n.n1 b { font-size: 5rem; } .ta-n.n2 b { font-size: 4rem; }
.ta-n p { margin: 0; font-size: .95rem; color: var(--soft); }

/* ---------------- Kalender ---------------- */
.sc.kal { justify-content: flex-start; }
.kal header { display: flex; flex-direction: column; gap: 1.2rem; max-width: 44rem; }
.kal h2 { font-size: 3.6rem !important; }
.kal-day { position: absolute; right: 0; top: 0; width: min(28rem, 34vw); border-left: 2px solid var(--signal); padding-left: 1.6rem; }
.kd-d { margin: 0 0 .8rem; font: 900 4.6rem/.85 var(--f-disp); text-transform: uppercase; }
.kd-d b { color: var(--signal); font-weight: 900; }
.kd-d span { display: block; font: 500 .8rem/1.4 var(--f-sans); text-transform: uppercase; letter-spacing: .16em; color: var(--muted); margin-top: .5rem; }
.kd-m { margin: 0 0 .6rem; font-weight: 600; font-size: .9rem; }
.kal-day ul { list-style: none; margin: 0; padding: 0; }
.kal-day li { display: grid; grid-template-columns: 5.4rem 1fr; gap: .8rem; padding: .5rem 0; border-top: 1px solid var(--line); font-size: .92rem; }
.kd-k { font: 500 .78rem/1.6 var(--f-mono); color: var(--muted); }
.kd-none { display: block !important; color: var(--muted); }

/* ---------------- Simulering ---------------- */
.sim { gap: 3.4vh; }
.sim h2 { font-size: 3.4rem !important; }
.sim-track { position: relative; height: 4.4rem; margin: 2vh 1rem 0; }
.sim-line { position: absolute; left: 0; right: 0; top: 1.6rem; height: 2px; background: var(--line-2); }
.sim-line i { display: block; height: 100%; width: 0; background: var(--signal); transition: width .8s var(--ease); }
.sim-pt { position: absolute; top: 1.6rem; translate: -50% -50%; display: flex; flex-direction: column; align-items: center; }
.sim-pt i { width: .8rem; height: .8rem; border-radius: 50%; border: 2px solid var(--line-2); background: var(--bg); transition: all .4s; }
.sim-pt span { position: absolute; top: 1.3rem; font-size: .66rem; font-weight: 500; white-space: nowrap; color: var(--muted); }
.sim-pt.done i { background: var(--signal); border-color: var(--signal); }
.sim-pt.cur span { color: var(--fg); font-weight: 600; }
.sim-me { position: absolute; top: 0; left: 0; translate: -50% -110%; transition: left .8s var(--ease); }
.sim-me span { display: block; font: 800 .8rem/1 var(--f-disp); letter-spacing: .1em; text-transform: uppercase; background: var(--signal); color: var(--ink); padding: .35rem .6rem; border-radius: 2px; }
.sim-me::after { content: ""; position: absolute; left: 50%; bottom: -5px; translate: -50% 0; border: 5px solid transparent; border-bottom: 0; border-top-color: var(--signal); }
.sim-now { display: grid; grid-template-columns: minmax(16rem, .8fr) 2fr; gap: 4vw; align-items: start; }
.sim-clock { font: 900 7.6rem/.82 var(--f-disp); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sim-clock .ph { font-size: .6em; }
.sim-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 3vw; }
.sim-col { display: flex; flex-direction: column; gap: .7rem; border-left: 1px solid var(--line-2); padding-left: 1.4rem; }
.sim-tx { margin: 0; font-size: 1.12rem; line-height: 1.5; min-height: 4.5em; }
.swap { animation: swap .55s var(--ease); }
@keyframes swap { from { opacity: 0; transform: translate3d(0, .6rem, 0); } to { opacity: 1; transform: none; } }

/* ---------------- Swimlane ---------------- */
.sw-sc { gap: 3.4vh; }
.sw-sc h2 { font-size: 3.4rem !important; max-width: 30ch !important; }
.lay-lanes .sw-sc { gap: 2vh; }
.lay-lanes .sw-sc h2 { font-size: 2.8rem !important; }
.lay-lanes .sw-role, .lay-lanes .sw-c { padding-top: .55rem; padding-bottom: .55rem; }
.lay-lanes .sw-c { font-size: .8rem; }
.sw { display: grid; grid-template-columns: 11rem repeat(var(--cols), minmax(0, 1fr)); max-width: 100%; }
.sw-ph { position: relative; padding: 0 1.2rem 1.4rem 0; font: 800 1.15rem/1 var(--f-disp); text-transform: uppercase; letter-spacing: .04em; }
.sw-ph::before { content: ""; position: absolute; left: 0; right: 0; bottom: .45rem; height: 1.5px; background: var(--signal); }
.sw-ph i { position: absolute; left: 0; bottom: .1rem; width: .8rem; height: .8rem; border-radius: 50%; background: var(--signal); }

.gj { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto 1fr; column-gap: 5vw; row-gap: 3vh; align-content: end; }

/* ---------------- Roller ---------------- */

.sn { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto auto 1fr; column-gap: 5vw; row-gap: 2.6vh; align-content: end; }

.svar .sn-o.feil .sn-l { color: var(--signal); }
.sn-rule { border-left: 2px solid var(--ok); padding-left: 1.4rem; display: flex; flex-direction: column; gap: .7rem; align-items: flex-start; }

.ck-r { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 3px; margin: .6rem 0 0;
  background: linear-gradient(90deg, var(--ok) 0 10%, var(--amber) 10% 70%, var(--signal) 70% 100%); cursor: ew-resize; }

.fe-m { font: 500 1.4rem/1.25 var(--f-sans); letter-spacing: -.01em; transition: font-size .5s var(--ease), color .4s; }
.fe-f { display: grid; grid-template-rows: 0fr; overflow: hidden; font-size: 1.05rem; line-height: 1.45; transition: grid-template-rows .55s var(--ease), margin .55s; }

.fin { align-items: center; text-align: center; justify-content: center; gap: 4vh; }

.pg-t.hl::after { content: ""; position: absolute; left: 50%; top: -2px; width: 4px; height: 4px; translate: -50% 0; border-radius: 50%; background: var(--signal); }
.pg-t:hover::before { background: var(--fg); }
.pg-lbl { font: 600 .54rem/1 var(--f-sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.hud-rolle { position: absolute; left: 2.4vw; bottom: calc(2.6vh + 2.6rem); display: flex; gap: .8rem; align-items: center; font-size: .72rem; pointer-events: auto; border: 1px solid var(--signal); border-radius: 999px; padding: .35rem .5rem .35rem .9rem; }

.hud-nav { display: none; position: absolute; right: 2.4vw; bottom: calc(2.6vh + 2.2rem); gap: .5rem; }

@media (pointer: coarse) { .hud-nav { display: flex; } }
.utf .hud-tl, .utf .hud-tr .hd, .utf .hud-btns [data-act="utf"] { display: none; }
.ub-hint { margin: 0; font-size: .66rem; color: var(--muted); pointer-events: auto; }
.ub-hint .lnk { font-size: inherit; }
.kartlag { pointer-events: none; }
.portrett .ro-n { padding: .35rem .6rem; }
.portrett .ro-n span { display: none; }

/* ---------------- Utforsk ---------------- */
#ubar { position: fixed; z-index: 9; top: 2.6vh; left: 2.4vw; right: 2.4vw; pointer-events: none; display: flex; flex-direction: column; gap: .8rem; }

.ub, .ub-f { display: flex; align-items: center; gap: .35rem; flex-wrap: wrap; pointer-events: auto; }

.kartfri #stage { pointer-events: none; }
.kartfri #app { cursor: grab; }


#app::after { content: ""; position: absolute; inset: 0; z-index: 7; background: rgba(13, 17, 16, .6); opacity: 0; pointer-events: none; transition: opacity .4s; }

#panel {
  --bg: var(--paper); --fg: var(--ink); --soft: rgba(13, 17, 16, .82); --muted: rgba(13, 17, 16, .58);
  --line: rgba(13, 17, 16, .13); --line-2: rgba(13, 17, 16, .28); --ph: #9a6a00; --ph-bg: rgba(154, 106, 0, .07);
  position: fixed; z-index: 8; top: 15vh; bottom: 0; left: 50%; translate: -50% 0; width: min(76rem, 96vw);
  background: var(--paper); color: var(--ink); border-radius: 10px 10px 0 0; overflow-y: auto; overscroll-behavior: contain;
  animation: opp .6s var(--ease);
}

.an-f h3 i { position: absolute; left: 0; bottom: 0; width: .7rem; height: .7rem; border-radius: 50%; background: var(--signal); }

/* ---------------- Rolig bevegelse ---------------- */
.rm *, .rm *::before, .rm *::after { transition-duration: .01ms !important; transition-delay: 0s !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }

/* ---------------- Små og høye skjermer ---------------- */
.portrett { --side: 5vw; --top: 11vh; }
.portrett body { overflow: hidden; }

.portrett .mi-cols, .portrett .tek-cols, .portrett .ny-foot, .portrett .sim-now, .portrett .sim-cols, .portrett .hj-cols, .portrett .sn, .portrett .sn-do, .portrett .gj, .portrett .sp-foot { grid-template-columns: 1fr; }

.portrett .fin-q { font-size: 3.2rem; }

}

/* ---------------- Utskrift av oppslag ---------------- */
@media print {
  html, body { overflow: visible !important; height: auto; background: #fff !important; color: #000 !important; }
  #app { position: static; overflow: visible; }

  .pn-in { padding: 0; max-width: none; }
  .op-a { break-inside: avoid; }
}

/* ==========================================================================
   Runde 2: logo, renere presentasjonsmodus, sikker nettleser, muntlig/praktisk,
   utfylling av plassholdere i presentasjonen
   ========================================================================== */

/* Logo – hvit tekst på mørke flater, svart tekst på lyse */
.lg-lys, .lg-mork { display: block; height: 100%; width: auto; }
body[data-tema="dark"] .lg-mork, body[data-tema="light"] .lg-lys { display: none; }

.logo { display: block; }
.pr-logo { height: min(6.2rem, 11vh); margin-bottom: .4rem; }
.fin-logo { height: min(5.4rem, 9vh); transition: transform 1.4s var(--ease), opacity .5s; }
.scene[data-step="1"] .fin-logo { transform: translate3d(0, -12vh, 0) scale(.8); }

/* Presentasjonsmodus: ingen menyer – bare kapittel, logo og en tynn framdriftslinje */
.hud-btns, .hd { display: none !important; }

html:not(.utf):not(.awake):not(.redig) #app { cursor: none; }
.pr-hint { font-size: .62rem; opacity: .55; letter-spacing: .04em; }
body[data-kap="3"] .stn:not(:hover) .stn-d { opacity: 0; }

/* Sikker nettleser */
.seb { gap: 2.6vh; }
.seb h2 { font-size: 4.4rem; }
.seb .lede { font-size: 1.02rem; max-width: 70ch; }
.seb-tl { list-style: none; margin: .4rem 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); position: relative; }
.seb-tl::before { content: ""; position: absolute; left: 0; right: 0; top: .38rem; height: 1.5px; background: var(--line-2); }

.sw-c.tom::before { content: none; }

  st("k2-teknisk", 2, "rutine", 11250, Y0, { lay: "h-bottom", t: "Når teknikken svikter", d: "Rutine", hd: "Skriftlig eksamen" });
  st("k3-portal", 3, "portal", 11900, Y0, { lay: "lanes", t: "Muntlig og praktisk eksamen", d: "03", hd: "Etter skriftlig periode" });
  st("k3-spor", 3, "spor", 13300, Y0, { lay: "lanes", t: "Tre eksamensformer", d: "Spor", hd: "Muntlig · muntlig-praktisk · praktisk" });
  st("k3-trekk", 3, "trekkmuntlig", 14000, Y0, { lay: "lanes", t: "Trekk og kunngjøring", d: "28.04", hd: "Trekk 28. april" });
  st("k3-forberedelse", 3, "forberedelse", 14700, Y0, { lay: "lanes", t: "Forberedelse", d: "24 t", hd: "Forberedelsesdelen" });
  st("k3-gjennomforing", 3, "gjennomforing", 15400, Y0, { lay: "lanes", t: "Eksamenstid", d: "Tid", hd: "Eksamenstid" });
  st("k3-parti", 3, "parti", 16100, Y0, { lay: "lanes", cam: { ay: 0.84 }, t: "Partier og sensorer", d: "5–7", hd: "Partier og sensorer" });
  st("k3-sensur", 3, "sensur", 16800, Y0, { lay: "lanes", cam: { ay: 0.86 }, t: "Vurdering og sensur", d: "Sensur", hd: "Vurdering og sensur" });
  st("k3-ansvar", 3, "swim", 17450, Y0, { lay: "lanes", cam: { ay: 0.9 }, data: "muntlig", t: "Ansvarsfordeling", d: "Ansvar", hd: "Muntlig og praktisk eksamen" });
  st("k4-roller", 4, "roller", KRYSS, Y0, { lay: "cross", t: "Roller og ansvar", d: "04", hd: "Hele perioden", former: ALLE_FORMER });
  st("k5-intro", 5, "hindringer", 20100, Y0, { lay: "hump", t: "Når noe ikke går som planlagt", d: "05", hd: "Når som helst" });
  const SCEN_FORM = { sent: ["skriftlig"], syk: ALLE_FORMER, teknisk: ["skriftlig"], hjelpemidler: ["skriftlig"], regelverk: ["skriftlig"], sensor: ["muntlig", "muntlig-praktisk", "praktisk"] };
  D.SCENARIOER.forEach((sc, i) => st("k5-" + sc.id, 5, "scenario", HUMPS[i], Y0 - HUMP_H, { lay: "hump", data: sc.id, t: sc.tittel, d: sc.nr, hd: "Hindring " + sc.nr, former: SCEN_FORM[sc.id] }));
  st("e-datoer", 6, "datoer", XE, 4300, { lay: "v-right", t: "De viktigste datoene", d: "Datoer", hd: "Oppsummering" });
  st("e-ansvar", 6, "ansvarsum", XE, 3600, { lay: "v-right", t: "De viktigste ansvarsområdene", d: "Ansvar", hd: "Oppsummering" });
  st("e-feil", 6, "feil", XE, 2900, { lay: "v-right", t: "Feil vi skal unngå", d: "Feil", hd: "Oppsummering" });
  st("e-hjelp", 6, "hjelp", XE, 2200, { lay: "v-right", t: "Her finner du hjelp", d: "Hjelp", hd: "Oppsummering" });
  st("e-slutt", 6, "slutt", XE, 1500, { lay: "center", t: "Vi er i mål", d: "Mål", hd: "Våren 2026", tema: "dark", stor: true, cams: [{}, { overview: true }] });

  const TEMA_KAP = ["dark", "light", "dark", "dark", "light", "dark", "light"];
  const FORM_KAP = { 0: ALLE_FORMER, 1: ALLE_FORMER, 2: ["skriftlig"], 3: ["muntlig", "muntlig-praktisk", "praktisk"], 4: ALLE_FORMER, 5: ALLE_FORMER, 6: ALLE_FORMER };
  const IDX = {};
  ST.forEach((s, i) => {
    IDX[s.id] = i;
    s.tema = s.tema || TEMA_KAP[s.kap];
    const m = s.data && D.MILEPAELER[s.data];
    s.former = s.former || (m && m.former) || FORM_KAP[s.kap];
    s.roller = new Set((m && m.roller) || []);
  });
  D.ROLLER.forEach((r) => r.oppgaver.forEach((o) => { if (IDX[o.stopp] != null) ST[IDX[o.stopp]].roller.add(r.id); }));
  ST.filter((s) => s.kap === 4 || s.kap === 6 || s.kap === 0).forEach((s) => D.ROLLER.forEach((r) => s.roller.add(r.id)));

  /* ---------------------------------------------------------------------
     DOM-lag
     --------------------------------------------------------------------- */
  const SVGNS = "http://www.w3.org/2000/svg";
  const app = $("#app");
  const svg = $("#track"), gCam = $("#cam");
  const nodesEl = $("#nodes"), parEl = $("#parallax"), stage = $("#stage");
  const hud = $("#hud"), ubar = $("#ubar"), panel = $("#panel"), help = $("#help");
  const mkPath = (d, cls) => { const p = doc.createElementNS(SVGNS, "path"); p.setAttribute("d", d); p.setAttribute("class", cls); p.setAttribute("vector-effect", "non-scaling-stroke"); gCam.appendChild(p); return p; };

  const dTrunk = roundPath(TRUNK);
  mkPath(dTrunk, "rt-base");
  const pLaneU = mkPath(roundPath(LANE_U), "rt-lane l-mp");
  const pLaneD = mkPath(roundPath(LANE_D), "rt-lane l-pr");
  const pLaneM = mkPath(roundPath(LANE_M), "rt-lane l-mu");
  const pCross = mkPath(roundPath(CROSS), "rt-cross");
  const pProg = mkPath(dTrunk, "rt-prog");
  const TOTAL = pProg.getTotalLength();
  const LEN = { u: pLaneU.getTotalLength(), d: pLaneD.getTotalLength(), m: pLaneM.getTotalLength(), c: pCross.getTotalLength() };

  // Prøvepunkter langs hovedsporet: brukes til å finne hvor langt linja skal tegnes.
  const SAMPLES = [];
  for (let l = 0; l <= TOTAL; l += 16) { const p = pProg.getPointAtLength(l); SAMPLES.push([l, p.x, p.y]); }
  function lenAt(x, y) {
    let best = 0, bd = Infinity;
    for (const [l, sx, sy] of SAMPLES) { const d = (sx - x) ** 2 + (sy - y) ** 2; if (d < bd) { bd = d; best = l; } }
    return best;
  }
  ST.forEach((s) => (s.L = lenAt(s.x, s.y)));

  /* ---------------------------------------------------------------------
     Kamera
     cam = { cx, cy, z } – verdenspunktet midt på skjermen og zoom.
     --------------------------------------------------------------------- */
  let W = 1920, H = 1080, S = 1;
  let RM = store.get("rolig", null);
  if (RM == null) RM = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const cam = { cx: 0, cy: 0, z: 1 };
  let prog = 0, tween = null, dirty = true;

  function measure() {
    W = innerWidth; H = innerHeight;
    S = clamp(Math.min(W / 1920, H / 1080), 0.38, 2.2);
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    root.classList.toggle("portrett", W < H * 1.05);
    dirty = true;
  }
  function anchors(lay) {
    const p = W < H * 1.05;
    switch (lay) {
      case "v-left": return { ax: p ? 0.06 : 0.16, ay: 0.5, z: 1 };
      case "v-right": return { ax: p ? 0.94 : 0.84, ay: 0.5, z: 1 };
      case "h-bottom": return { ax: p ? 0.08 : 0.12, ay: p ? 0.93 : 0.85, z: 1 };
      case "lanes": return { ax: p ? 0.06 : 0.1, ay: p ? 0.86 : 0.72, z: p ? 0.2 : 0.34 };
      case "cross": return { ax: 0.5, ay: 0.5, z: 1 };
      case "hump": return { ax: p ? 0.1 : 0.15, ay: p ? 0.92 : 0.82, z: 1 };
      default: return { ax: 0.5, ay: 0.5, z: 1 };
    }
  }
  function camOverview(extraTop) {
    const bw = BBOX.x1 - BBOX.x0, bh = BBOX.y1 - BBOX.y0;
    const z = Math.min((W * 0.9) / bw, (H * (extraTop ? 0.56 : 0.7)) / bh);
    return { cx: (BBOX.x0 + BBOX.x1) / 2, cy: (BBOX.y0 + BBOX.y1) / 2 - (H * (extraTop ? 0.1 : 0.04)) / z, z, ax: 0.5, ay: 0.5 };
  }
  function camTarget(s, step) {
    const c = Object.assign({}, s.cam || {}, (s.cams && s.cams[step]) || {});
    if (s.lay === "overview" || c.overview) return camOverview(true);
    const a = anchors(s.lay);
    let z = (c.z || a.z) * S;
    let ax = c.ax != null ? c.ax : a.ax, ay = c.ay != null ? c.ay : a.ay;
    let wx = c.x != null ? c.x : s.x, wy = c.y != null ? c.y : s.y;
    if (s.kal) { // hele mai skal få plass
      const span = 17 * MAI_STEG + 500;
      z = Math.min((W * 0.92) / span, 0.6 * S);
      wx = MAI0 + (17 * MAI_STEG) / 2; ax = 0.5; ay = root.classList.contains("portrett") ? 0.9 : 0.8;
    }
    return { cx: wx + (0.5 - ax) * (W / z), cy: wy + (0.5 - ay) * (H / z), z, ax, ay, wx, wy };
  }
  function progTarget(s, step) {
    if (s.cams && s.cams[step] && s.cams[step].overview) return TOTAL;
    if (s.lx) return lenAt(s.lx[step] != null ? s.lx[step] : s.x, s.y);
    return s.L;
  }
  const project = (x, y, c = cam) => [(x - c.cx) * c.z + W / 2, (y - c.cy) * c.z + H / 2];

  function flyTo(t, dur, p1) {
    if (dur <= 0) { cam.cx = t.cx; cam.cy = t.cy; cam.z = t.z; prog = p1; tween = null; dirty = true; return; }
    const from = { cx: cam.cx, cy: cam.cy, z: cam.z };
    const dist = Math.hypot(t.cx - from.cx, t.cy - from.cy);
    const zmin = Math.min(from.z, t.z);
    const zfit = (Math.min(W, H) * 1.4) / Math.max(dist, 1);
    const bump = dist * zmin > W * 1.6 ? Math.max(0, Math.log(zmin / zfit)) * 0.85 : 0;
    tween = { from, t, p0: prog, p1, t0: performance.now(), dur, bump };
  }
  function durFor(t) {
    if (RM) return 0;
    const dist = Math.hypot(t.cx - cam.cx, t.cy - cam.cy) * Math.min(cam.z, t.z);
    const dz = Math.abs(Math.log(t.z / cam.z));
    return clamp(620 + Math.sqrt(dist) * 13 + dz * 320, 650, 2100);
  }

  /* ---------------------------------------------------------------------
     Noder som følger kameraet: stoppesteder, maidager, månedsnavn.
     --------------------------------------------------------------------- */
  const NODES = [];
  const addNode = (el, x, y, layer = nodesEl, depth = 1) => { layer.appendChild(el); const n = { el, x, y, depth, vis: true }; NODES.push(n); return n; };
  const html = (s) => { const t = doc.createElement("template"); t.innerHTML = s.trim(); return t.content.firstElementChild; };

  ST.forEach((s, i) => {
    const el = html(`<button class="stn ${/^v-/.test(s.lay) ? "o-v" : "o-h"}${s.stor ? " stor" : ""}" data-i="${i}" aria-label="${esc(s.t)}"><i></i><span class="stn-d">${esc(s.d)}</span><span class="stn-t">${esc(s.t)}</span></button>`);
    s.node = addNode(el, s.x, s.y);
  });
  // Maidagene: én hake per dag fra 4. til 21. mai
  const KAL = {};
  D.KALENDER.forEach((k) => (KAL[k.dato] = k));
  for (let i = 0; i < 18; i++) {
    const dt = new Date(2026, 4, 4 + i);
    const iso = `2026-05-${String(4 + i).padStart(2, "0")}`;
    const k = KAL[iso], we = dt.getDay() === 0 || dt.getDay() === 6;
    const fag = k && k.fag ? k.fag : [];
    const el = html(`<button class="tick${we ? " we" : ""}${k && k.fri ? " fri" : ""}${fag.length ? " ex" : ""}" data-dato="${iso}" tabindex="-1" aria-label="${dt.getDate()}. mai">
      <span class="tk-f">${k && k.fri ? `<em>${esc(k.fri)}</em>` : fag.map(([kode, navn]) => `<span>${esc(navn)}</span>`).join("")}</span>
      <i></i><span class="tk-d">${dt.getDate()}</span><span class="tk-w">${UKEDAG[dt.getDay()]}</span></button>`);
    addNode(el, MAI0 + i * MAI_STEG, Y0);
  }
  // Store, svake månedsnavn i bakgrunnen – parallakse gir dybde
  [["Januar – april", X1 + 1500, 2500, "v", 1], ["Mai", MAI0 + 2100, Y0 - 900, "h", 2], ["Juni", XE - 1800, 2600, "v", 6]].forEach(([t, x, y, o, k]) =>
    addNode(html(`<div class="par par-${o} pk-${k}">${esc(t)}</div>`), x, y, parEl, 0.55));
  // Navn på sporene i kapittel 3
  [["Muntlig-praktisk", -LANE, "l-mp"], ["Muntlig", 0, "l-mu"], ["Praktisk", LANE, "l-pr"]].forEach(([t, dy, c]) =>
    addNode(html(`<div class="lane-tag ${c}">${esc(t)}</div>`), LANE_A + 900, Y0 + dy));

  /* ---------------------------------------------------------------------
     Tegnesløyfa
     --------------------------------------------------------------------- */
  let wa = []; // verdensforankrede elementer i scenen
  function frame(now) {
    if (tween) {
      const tt = clamp((now - tween.t0) / tween.dur, 0, 1), e = ease(tt);
      cam.cx = lerp(tween.from.cx, tween.t.cx, e);
      cam.cy = lerp(tween.from.cy, tween.t.cy, e);
      cam.z = Math.exp(lerp(Math.log(tween.from.z), Math.log(tween.t.z), e) - tween.bump * Math.sin(Math.PI * e));
      prog = lerp(tween.p0, tween.p1, easeOut(tt));
      if (tt >= 1) tween = null;
      dirty = true;
    }
    if (dirty) { render(); dirty = false; }
    requestAnimationFrame(frame);
  }
  function render() {
    const z = cam.z, tx = W / 2 - cam.cx * z, ty = H / 2 - cam.cy * z;
    gCam.setAttribute("transform", `matrix(${z} 0 0 ${z} ${tx} ${ty})`);
    pProg.style.strokeDasharray = `${Math.max(0.01, prog)} ${TOTAL + 50}`;
    const jx = SAMPLES[Math.min(SAMPLES.length - 1, Math.round(prog / 16))][1];
    const fl = clamp((jx - LANE_A) / (LANE_B - LANE_A), 0, 1);
    pLaneU.style.strokeDasharray = `${fl * LEN.u} ${LEN.u + 50}`;
    pLaneD.style.strokeDasharray = `${fl * LEN.d} ${LEN.d + 50}`;
    pLaneM.style.strokeDasharray = `${clamp((jx - LANE_A - 600) / (LANE_B - LANE_A - 1200), 0, 1) * LEN.m} ${LEN.m + 50}`;
    const fc = clamp((jx - (KRYSS - 300)) / 300, 0, 1);
    pCross.style.strokeDasharray = `${fc * LEN.c} ${LEN.c + 50}`;
    pCross.style.strokeDashoffset = `${-(1 - fc) * LEN.c * 0.5}`;
    nodesEl.style.setProperty("--tw", `${Math.max(40, MAI_STEG * z - 8)}px`);
    const lod = z < 0.11 * S ? "far" : z < 0.3 * S ? "mid" : "near";
    if (nodesEl.dataset.lod !== lod) nodesEl.dataset.lod = lod;
    const place = (n, sx, sy) => {
      const vis = sx > -400 && sx < W + 400 && sy > -300 && sy < H + 300;
      if (vis !== n.vis) { n.el.style.visibility = vis ? "" : "hidden"; n.vis = vis; }
      if (vis) n.el.style.transform = `translate3d(${sx.toFixed(1)}px,${sy.toFixed(1)}px,0)`;
    };
    for (const n of NODES) {
      if (n.depth === 1) place(n, n.x * z + tx, n.y * z + ty);
      else place(n, W / 2 + (n.x - cam.cx) * z * n.depth, H / 2 + (n.y - cam.cy) * z * n.depth);
    }
    for (const n of wa) place(n, n.x * z + tx, n.y * z + ty);
    ST.forEach((s) => s.node.el.classList.toggle("done", s.L <= prog + 2));
  }

  /* ---------------------------------------------------------------------
     Hjelpere for scener
     --------------------------------------------------------------------- */
  const pts = (list, s) => `<ul class="pts"${s != null ? ` data-s="${s}"` : ""}>${list.map((p, i) => `<li style="--i:${i}"><p>${fmt(p.tekst)}</p>${tag(p.type, p.kontroller)}${src(p.kilde)}</li>`).join("")}</ul>`;
  const fact = (f, s) => (f ? `<aside class="fact"${s != null ? ` data-s="${s}"` : ""}>${tag(f.type, f.kontroller)}<p>${fmt(f.tekst)}</p>${src(f.kilde)}</aside>` : "");
  const kapOf = (s) => D.KAPITLER[s.kap];
  const eyebrow = (t, s = 0) => `<p class="eyebrow" data-s="${s}">${t}</p>`;
  const waEl = (x, y, inner, cls = "") => `<div class="wa ${cls}" data-wx="${x}" data-wy="${y}">${inner}</div>`;
  const laneLabels = (x, fn, s = 0) =>
    [["muntlig-praktisk", -LANE], ["muntlig", 0], ["praktisk", LANE]].map(([id, dy], i) =>
      waEl(x, Y0 + dy, `<div class="ll f-${id}" data-s="${s}" style="--i:${i}">${fn(D.SPOR.find((p) => p.id === id))}</div>`, "dn")).join("");

  function checklist(id, items, s) {
    const done = new Set(store.get("cl-" + id, []));
    return `<div class="cl" data-s="${s}" data-cl="${id}">
      <div class="cl-top"><span class="cl-lbl">Sjekkliste</span><span class="cl-n"><b>${done.size}</b> av ${items.length} klart</span></div>
      <div class="cl-bar"><i style="width:${(done.size / items.length) * 100}%"></i></div>
      <ul>${items.map((it, i) => `<li style="--i:${i}"><button class="cl-it" data-k="${i}" aria-pressed="${done.has(i)}"><span class="cl-box"></span><span class="cl-tx">${fmt(it.tekst)}</span>${tag(it.type)}</button></li>`).join("")}</ul></div>`;
  }
  function bindChecklists(el) {
    $$("[data-cl]", el).forEach((cl) => {
      const id = cl.dataset.cl, n = $$(".cl-it", cl).length;
      const upd = () => {
        const on = $$(".cl-it", cl).filter((b) => b.getAttribute("aria-pressed") === "true").map((b) => +b.dataset.k);
        store.set("cl-" + id, on);
        $(".cl-n b", cl).textContent = on.length;
        $(".cl-bar i", cl).style.width = (on.length / n) * 100 + "%";
        cl.classList.toggle("full", on.length === n);
        el.dispatchEvent(new CustomEvent("cl", { detail: on }));
      };
      cl.addEventListener("click", (e) => {
        const b = e.target.closest(".cl-it"); if (!b || e.target.closest("a")) return;
        b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true");
        upd();
      });
      cl.classList.toggle("full", store.get("cl-" + id, []).length === n);
    });
  }
  function countUp(el) {
    $$("[data-count]", el).forEach((b) => {
      const gate = b.closest("[data-s]");
      if (b._done || (gate && !gate.classList.contains("on"))) return; b._done = true;
      const to = +b.dataset.count, fmtN = (v) => Math.round(v).toLocaleString("nb-NO");
      if (RM) { b.textContent = fmtN(to); return; }
      const t0 = performance.now();
      const tick = (now) => { const t = clamp((now - t0) / 1400, 0, 1); b.textContent = fmtN(to * easeOut(t)); if (t < 1) requestAnimationFrame(tick); };
      requestAnimationFrame(tick);
    });
  }

  /* ---------------------------------------------------------------------
     SCENER
     Hver scene: { html, steps, mount(el), step(n, el), destroy() }
     data-s="n" på et element = vises fra steg n.
     --------------------------------------------------------------------- */
  const SC = {};
  const merke = $("#merke");
  const LOGO = { lys: merke ? $(".lg-lys", merke).getAttribute("src") : "", mork: merke ? $(".lg-mork", merke).getAttribute("src") : "" };
  const logo = (cls, s) => (LOGO.lys ? `<span class="logo ${cls}"${s != null ? ` data-s="${s}"` : ""}><img class="lg-lys" src="${LOGO.lys}" alt="${esc(D.META.skole)}"><img class="lg-mork" src="${LOGO.mork}" alt="${esc(D.META.skole)}"></span>` : `<p class="eyebrow">${fmt(D.META.skole)}</p>`);

  SC.prolog = () => {
    const q = esc(D.META.sporsmal).replace(/(vite|gjøre|være forberedt på)/g, "<em>$1</em>");
    return {
      steps: 3,
      html: `
      ${waEl(0, 0, `<div class="pr-year" data-so="0" aria-label="2026">${[..."2026"].map((c, i) => `<span style="--i:${i}">${c}</span>`).join("")}</div>`)}
      ${waEl(300, 0, `<div class="pr-title" data-so="1">${logo("pr-logo")}<h1>Eksamen<br>våren 2026</h1><p class="pr-sub">${fmt(D.META.undertittel)}</p></div>`, "up")}
      ${waEl(1650, 0, `<div class="pr-q" data-so="2"><p class="eyebrow">Spørsmålet vi skal svare på</p><p class="pr-qt">${q}</p></div>`, "up")}
      <p class="pr-hint" data-s="0">→ starter reisen · <kbd>E</kbd> utforsk · <kbd>?</kbd> hurtigtaster</p>`,
    };
  };

  const KAPLAB = [
    { k: 1, x: X1, y: 2550, pos: "r", go: "k1-portal" },
    { k: 2, x: MAI0 + 2100, y: Y0, pos: "b", go: "k2-portal" },
    { k: 3, x: 15200, y: Y0 - LANE, pos: "t", go: "k3-portal" },
    { k: 4, x: KRYSS, y: Y0 + 380, pos: "b", go: "k4-roller" },
    { k: 5, x: 23600, y: Y0 - HUMP_H, pos: "t", go: "k5-intro" },
    { k: 6, x: XE, y: 2900, pos: "l", go: "e-datoer" },
  ];
  const kartLabels = (s) => KAPLAB.map((l, i) => { const k = D.KAPITLER[l.k]; return waEl(l.x, l.y, `<button class="kt-lab pos-${l.pos}" data-go="${l.go}"${s ? ' data-s="0"' : ""} style="--i:${i}"><span class="nr">${k.nr || "Mål"}</span><span class="nm">${fmt(k.navn)}</span><span class="pe">${fmt(k.periode)}</span></button>`); }).join("");
  SC.kart = () => ({
    steps: 1,

  SC.hindringer = (s) => {
    const k = kapOf(s);
    return {
      steps: 2,
      html: `<div class="sc hi"><header>${eyebrow(`Kapittel 5 · ${fmt(k.periode)}`)}<div class="po-nr hi-nr" data-flip aria-hidden="true">05</div><h2 data-s="0">${fmt(k.navn)}</h2><p class="lede" data-s="0">${fmt(k.ingress)}</p></header>
        <ol class="hi-list" data-s="1">${D.SCENARIOER.map((x, i) => `<li style="--i:${i}"><button data-go="k5-${x.id}"><span class="hi-n">${x.nr}</span><span class="hi-t">${fmt(x.tittel)}</span></button></li>`).join("")}</ol></div>`,

  };

  SC.scenario = (s) => {
    const X = D.SCENARIOER.find((x) => x.id === s.data);
    return {
      steps: 4,
      html: `<div class="sc sn">
        <header>${eyebrow(`Hindring ${X.nr} · ${fmt(X.tittel)}`)}<p class="sn-sit" data-flip>${fmt(X.situasjon)}</p></header>
        ${X.klokke ? `<div class="ck" data-s="1"><div class="ck-top"><span class="ck-t">09:47</span><span class="ck-o"></span></div>
          <input class="ck-r" type="range" min="530" max="630" step="1" value="587" aria-label="Når møter eleven?"><div class="ck-sc"><span style="left:${(10 / 100) * 100}%">09:00</span><span style="left:${(70 / 100) * 100}%">10:00</span></div></div>` : ""}
        <div class="sn-q" data-s="1"><p class="sn-qt">${fmt(X.sporsmal)}</p><div class="sn-opts">${X.valg.map((v, i) => `<button class="sn-o" data-k="${i}" data-r="${v.riktig}"><span class="sn-l">${"ABC"[i]}</span>${fmt(v.tekst)}</button>`).join("")}</div></div>
        <div class="sn-ans" data-s="2"><div class="sn-rule">${tag(X.regelType, X.kontroller)}<p>${fmt(X.regel)}</p>${src(X.kilde)}</div></div>
        <div class="sn-do" data-s="3"><div><p class="eyebrow">Gjør dette</p><ol>${X.gjor.map((g) => `<li>${fmt(g)}</li>`).join("")}</ol></div>
          <div class="sn-k"><p class="eyebrow">Kontakt</p><p>${fmt(X.kontakt)}</p></div></div></div>`,
      mount(el) {
        el.addEventListener("click", (e) => { const o = e.target.closest(".sn-o"); if (!o) return; el.dataset.valgt = o.dataset.k; if (cur.step < 2) setStep(2); else markOpts(el); });
        const r = $(".ck-r", el);
        if (r) {
          const upd = () => {
            const m = +r.value, hh = Math.floor(m / 60), mm = m % 60;
            $(".ck-t", el).textContent = `${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}`;
            const o = $(".ck-o", el);
            o.className = "ck-o " + (m < 540 ? "ok" : m < 600 ? "mid" : "no");
            o.textContent = m < 540 ? "I god tid før start" : m < 600 ? `Får starte. Mister ${m - 540} min – tiden kompenseres ikke.` : "Får ikke gjennomføre eksamen.";
          };
          r.addEventListener("input", upd); upd();
        }
      },
      step(n, el) { el.classList.toggle("svar", n >= 2); if (n >= 2) markOpts(el); },
    };
  };
  function markOpts(el) {
    $$(".sn-o", el).forEach((o) => { o.classList.toggle("rett", o.dataset.r === "true"); o.classList.toggle("feil", o.dataset.r !== "true" && el.dataset.valgt === o.dataset.k); });
  }

  SC.datoer = () => {
    const keys = ["tilrettelegging", "trekk", "forsteSkriftlige", "sisteSkriftlige", "muntligPeriode", "fellessensur", "sensurfrist", "klage", "hurtigklage"];
    return {
      steps: 2,
      html: `<div class="sc ep da"><header>${eyebrow("Epilog · Vi er i mål")}<h2 data-s="0">De viktigste datoene</h2></header>
        <ol class="da-l" data-s="1">${keys.map((k, i) => { const d = D.DATOER[k]; return `<li style="--i:${i}"><span class="da-d">${fmt(d.vis)}${d.kl ? `<small>kl. ${esc(d.kl)}</small>` : ""}</span><span class="da-t">${fmt(d.tekst)}</span>${tag(d.type, d.kontroller)}</li>`; }).join("")}</ol></div>`,
    };
  };

  SC.ansvarsum = () => ({
    steps: 2,
    html: `<div class="sc ep as"><header>${eyebrow("Epilog · Vi er i mål")}<h2 data-s="0">Hvem har ansvaret for hva?</h2></header>
      <ol class="as-l" data-s="1">${ROLLE_ORDEN.map((id, i) => `<li style="--i:${i}"><button data-hl="${id}" class="as-r"><b>${esc(R[id].navn)}</b><span>${fmt(R[id].ansvar)}</span></button></li>`).join("")}</ol></div>`,
    mount(el) { el.addEventListener("click", (e) => { const b = e.target.closest("[data-hl]"); if (b) { openPanel("ansvar", b.dataset.hl); } }); },
  });

  SC.feil = () => ({
    steps: D.FEIL.length + 1,
    html: `<div class="sc ep fe"><header>${eyebrow("Epilog · Vi er i mål")}<h2 data-s="0">${D.FEIL.length} feil vi skal unngå</h2><p class="lede" data-s="0">Klikk på en påstand – eller trykk → – for å se hva som faktisk gjelder.</p></header>
      <ol class="fe-l">${D.FEIL.map((f, i) => `<li data-s="0" style="--i:${i}"><button class="fe-b" data-k="${i}"><span class="fe-n">${String(i + 1).padStart(2, "0")}</span><span class="fe-m">${fmt(f.myte)}</span><span class="fe-f"><span>${fmt(f.fakta)}</span></span></button></li>`).join("")}</ol></div>`,
    mount(el) { el.addEventListener("click", (e) => { const b = e.target.closest(".fe-b"); if (b) b.classList.toggle("snudd"); }); },
    step(n, el) { $$(".fe-b", el).forEach((b, i) => b.classList.toggle("snudd", i < n)); },
  });

  SC.hjelp = () => ({
    steps: 2,
    html: `<div class="sc ep hj"><header>${eyebrow("Epilog · Vi er i mål")}<h2 data-s="0">Her finner du hjelp</h2></header>
      <div class="hj-cols">
        <div class="hj-lok" data-s="0"><p class="eyebrow">Ved Hustadvika vgs ${tag("lokal")}</p>
          <dl>${D.HJELP.lokalt.map((h) => `<div><dt>${fmt(h.rolle)}</dt><dd>${fmt(h.hvem)}${h.kontakt ? `<br><span>${fmt(h.kontakt)}</span>` : ""}</dd></div>`).join("")}</dl></div>
        <div class="hj-nas" data-s="1"><p class="eyebrow">Nasjonalt og i fylket</p>
          <ul>${D.HJELP.nasjonalt.map((k) => `<li>${src(k)}</li>`).join("")}</ul>
          <button class="btn" data-act="utf">Åpne oppslagsverket <kbd>E</kbd></button></div>
      </div></div>`,
  });

  SC.slutt = () => ({
    steps: 2,
    html: `<div class="sc fin">${logo("fin-logo", 0)}
      <p class="fin-q" data-flip>${fmt(D.META.sluttbudskap)}</p>
      <p class="fin-hint" data-s="1">Hele reisen – fra januar til juni. Trykk <kbd>E</kbd> for å bruke presentasjonen som oppslagsverk.</p></div>`,
  });

  /* ---------------------------------------------------------------------
     Navigasjon
     --------------------------------------------------------------------- */
  const state = { mode: "pres", rolle: null, form: null, kartFri: false, tab: null };
  let cur = null;
  const stepsOf = (s) => (s._steps != null ? s._steps : (s._steps = SC[s.scene](s).steps || 1));

  function applyStep(c, n, silent) {
    $$("[data-s]", c.el).forEach((e) => e.classList.toggle("on", +e.dataset.s <= n));
    $$("[data-so]", c.el).forEach((e) => e.classList.toggle("on", +e.dataset.so === n));
    c.el.dataset.step = n;
    if (!silent && c.def.step) c.def.step(n, c.el);
  }
  function setStep(n) {
    if (!cur || cur.dead) return;
    const s = cur.stop;
    n = clamp(n, 0, stepsOf(s) - 1);
    const old = cur.step;
    cur.step = n;
    applyStep(cur, n);
    if ((s.cams && s.cams.length > 1) || s.lx) {
      const t = camTarget(s, n);
      flyTo(t, durFor(t), progTarget(s, n));
      if (s.cams && s.cams[n] && s.cams[n].overview) body.classList.add("is-overview"); else if (s.lay !== "overview") body.classList.remove("is-overview");
    }
    if (old !== n) updateHash();
    updateHUD();
  }

  function goTo(i, step = 0, o = {}) {
    i = clamp(i, 0, ST.length - 1);
    const s = ST[i];
    step = clamp(step, 0, stepsOf(s) - 1);
    if (cur && cur.i === i && !cur.dead) { setStep(step); return; }
    const t = camTarget(s, step);
    const dur = o.instant ? 0 : durFor(t);
    const from = cur ? cur.stop : null;
    const dx = from ? s.x - from.x : 1, dy = from ? s.y - from.y : 0, dl = Math.hypot(dx, dy) || 1;
    flyTo(t, dur, progTarget(s, step));
    body.dataset.tema = s.tema;
    body.classList.toggle("is-overview", s.lay === "overview" || !!(s.cams && s.cams[step] && s.cams[step].overview));
    body.dataset.kap = s.kap;
    body.dataset.stopp = s.id;
    nodesEl.classList.toggle("kal", !!s.kal);
    if (cur && !cur.dead) leave(cur, dx / dl, dy / dl);
    enter(s, i, step, dur, dx / dl, dy / dl);
    ST.forEach((x) => x.node.el.classList.toggle("cur", x === s));
    if (!o.keepFri) setKartFri(false);
    updateHUD(true);
    updateHash();
  }
  function leave(c, ux, uy) {
    const el = c.el;
    if (c.def.destroy) c.def.destroy();
    el.style.setProperty("--lx", `${-ux * 90}px`); el.style.setProperty("--ly", `${-uy * 90}px`);
    el.classList.remove("in"); el.classList.add("out");
    el.setAttribute("aria-hidden", "true");
    wa = [];
    setTimeout(() => el.remove(), RM ? 0 : 450);
  }
  function enter(s, i, step, dur, ux, uy) {
    const def = SC[s.scene](s);
    const el = doc.createElement("section");
    el.className = `scene sc-${s.scene} lay-${s.lay} kap-${s.kap}`;
    el.setAttribute("aria-label", plain(s.t));
    el.innerHTML = def.html;
    const a = camTarget(s, step);
    setStageVars(el, s, a);
    el.style.setProperty("--ex", `${ux * 110}px`); el.style.setProperty("--ey", `${uy * 110}px`);
    stage.appendChild(el);
    cur = { i, stop: s, step, el, def };
    wa = $$(".wa", el).map((w) => ({ el: w, x: +w.dataset.wx, y: +w.dataset.wy, vis: true }));
    if (def.mount) def.mount.call(def, el);
    applyStep(cur, step, true);
    dirty = true;
    const delay = RM ? 0 : clamp(dur * 0.42, 0, 820);
    const c = cur;
    setTimeout(() => {
      if (cur !== c) return;
      el.classList.add("in");
      applyStep(c, c.step);
      flip(el, a);
    }, delay);
  }
  function setStageVars(el, s, a) {
    el.style.setProperty("--tx", `${a.ax * W}px`);
    el.style.setProperty("--ty", `${a.ay * H}px`);
    el.style.setProperty("--lt", `${a.ay * H - LANE * a.z}px`);
  }
  // Delt element: stoppestedet vokser ut til scenens store tittel/dato.
  function flip(el, a) {
    const f = $("[data-flip]", el);
    if (!f) return;
    f.classList.add("flipped");
    if (RM || !f.animate) return;
    const r = f.getBoundingClientRect();
    if (!r.width) return;
    const dx = a.ax * W - (r.left + r.width / 2), dy = a.ay * H - (r.top + r.height / 2);
    f.animate([
      { transform: `translate(${dx}px, ${dy}px) scale(0.04)`, opacity: 0 },
      { opacity: 1, offset: 0.35 },
      { transform: "none", opacity: 1 },
    ], { duration: 820, easing: "cubic-bezier(.2,.75,.1,1)" });
  }

  function next() { if (!cur) return; if (cur.step < stepsOf(cur.stop) - 1) setStep(cur.step + 1); else if (cur.i < ST.length - 1) goTo(cur.i + 1, 0); }
  function prev() { if (!cur) return; if (cur.step > 0) setStep(cur.step - 1); else if (cur.i > 0) goTo(cur.i - 1, stepsOf(ST[cur.i - 1]) - 1); }
  const fullt = (i) => (state.mode === "utf" ? stepsOf(ST[i]) - 1 : 0);
  function goId(id, step) { const i = IDX[id]; if (i != null) { closePanel(); goTo(i, step != null ? step : fullt(i)); } }

  function updateHash() {
    if (!cur) return;
    const h = `#${cur.stop.id}${cur.step ? "/" + cur.step : ""}`;
    try { history.replaceState(null, "", h); } catch (e) { /* file:// i enkelte nettlesere */ }
  }

  /* ---------------------------------------------------------------------
     HUD: kapittel, dato, framdrift
     --------------------------------------------------------------------- */
  function buildHUD() {
    const segs = D.KAPITLER.map((k, ki) => {
      const ss = ST.map((s, i) => [s, i]).filter(([s]) => s.kap === ki);
      return `<div class="pg-seg" style="flex:${ss.length}"><div class="pg-ticks">${ss.map(([s, i]) => `<button class="pg-t" data-i="${i}" aria-label="${esc(s.t)}" title="${esc(plain(s.t))}"></button>`).join("")}</div><span class="pg-lbl">${esc(k.kort)}</span></div>`;
    }).join("");
    hud.innerHTML = `
      <div class="hud-tl"><span class="hk-nr"></span><span class="hk-nm"></span></div>
      <div class="hud-tr"><span class="hd"></span>
        <span class="hud-btns"><button class="hb" data-act="utf">Utforsk <kbd>E</kbd></button><button class="hb" data-act="rm" aria-pressed="${RM}">Rolig bevegelse</button><button class="hb" data-act="fs">Fullskjerm <kbd>F</kbd></button><button class="hb" data-act="help" aria-label="Hurtigtaster">?</button></span></div>
      <div class="hud-rolle" hidden></div>
      <div class="hud-b"><div class="pg">${segs}</div><span class="pg-n"><b>1</b> / ${ST.length}</span></div>
      <div class="hud-nav"><button data-act="prev" aria-label="Forrige">‹</button><button data-act="next" aria-label="Neste">›</button></div>
      <p class="sr" aria-live="polite"></p>`;
  }
  let lastKap = -1;
  function updateHUD(changed) {
    if (!cur) return;
    const s = cur.stop, k = D.KAPITLER[s.kap];
    if (s.kap !== lastKap) {
      const tl = $(".hud-tl", hud);
      tl.classList.remove("swap"); void tl.offsetWidth; tl.classList.add("swap");
      $(".hk-nr", hud).textContent = k.nr ? `Kapittel ${+k.nr}` : k.kort;
      $(".hk-nm", hud).innerHTML = fmt(k.navn);
      lastKap = s.kap;
    }
    $(".hd", hud).innerHTML = fmt(s.hd || "");
    $$(".pg-t", hud).forEach((b) => { const i = +b.dataset.i; b.classList.toggle("done", i < cur.i); b.classList.toggle("cur", i === cur.i); b.classList.toggle("hl", !!state.rolle && ST[i].roller.has(state.rolle)); });
    $(".pg-n b", hud).textContent = cur.i + 1;
    if (changed) $(".sr", hud).textContent = `${k.navn}: ${plain(s.t)}`;
  }
  let idleT;
  function wake() { root.classList.add("awake"); clearTimeout(idleT); idleT = setTimeout(() => root.classList.remove("awake"), 2600); }

  /* ---------------------------------------------------------------------
     Rollefremheving og filter
     --------------------------------------------------------------------- */
  function setRolle(id) {
    state.rolle = id;
    ST.forEach((s) => s.node.el.classList.toggle("hl", !!id && s.roller.has(id)));
    root.classList.toggle("har-rolle", !!id);
    const r = $(".hud-rolle", hud);
    if (id) { r.hidden = false; r.innerHTML = `<span>Fremhevet: <b>${esc(R[id].navn)}</b></span><button data-act="norolle" aria-label="Fjern fremheving">Fjern</button>`; }
    else r.hidden = true;
    updateHUD();
    if (state.mode === "utf") renderUbar();
  }
  function setForm(id) {
    state.form = id;
    ST.forEach((s) => s.node.el.classList.toggle("dim", !!id && !s.former.includes(id)));
    if (state.mode === "utf") renderUbar();
  }

  /* ---------------------------------------------------------------------
     Utforskermodus
     --------------------------------------------------------------------- */

  function renderUbar() {
    ubar.innerHTML = `<nav class="ub" aria-label="Utforsk">
      <span class="ub-t">Utforsk</span>
      <button data-tab="kart" aria-pressed="${state.kartFri && !state.tab}">Kart</button>
      <button data-tab="oppslag" aria-pressed="${state.tab === "oppslag"}">Oppslag</button>
      <button data-tab="ansvar" aria-pressed="${state.tab === "ansvar"}">Mitt ansvar</button>
      <button data-tab="rutiner" aria-pressed="${state.tab === "rutiner"}">Rutiner</button>
      <button data-tab="plass" aria-pressed="${state.tab === "plass"}">Plassholdere <b>${igjen()}</b></button>
      <button data-tab="kilder" aria-pressed="${state.tab === "kilder"}">Kilder</button>
      <span class="ub-sp"></span>
      <button class="ub-pres" data-act="pres">Presentasjonsmodus</button></nav>
      <div class="ub-f">
        <span class="ub-fl">Eksamensform</span>${[{ id: null, navn: "Alle" }].concat(D.FORMER).map((f) => `<button class="chip" data-form="${f.id || ""}" aria-pressed="${state.form === f.id}">${f.farge ? `<i style="background:${f.farge}"></i>` : ""}${esc(f.navn)}</button>`).join("")}
        <span class="ub-fl">Rolle</span>${[{ id: null, navn: "Ingen" }].concat(ROLLE_ORDEN.map((r) => R[r])).map((r) => `<button class="chip" data-rolle="${r.id || ""}" aria-pressed="${state.rolle === r.id}">${esc(r.navn)}</button>`).join("")}
      </div>
      <p class="ub-hint">${state.kartFri ? "Dra for å flytte · rull for å zoome · klikk et stopp for å åpne det" : `<button class="lnk" data-tab="kart">‹ Tilbake til kartet</button> · piltastene går videre i reisen`}</p>`;
  }
  function setMode(m) {
    state.mode = m;
    root.classList.toggle("utf", m === "utf");
    if (m === "utf") { renderUbar(); setKartFri(true); }
    else { closePanel(); ubar.innerHTML = ""; returnToStop(); }
  }
  let kartLag = null;
  function setKartFri(on) {
    state.kartFri = on;
    root.classList.toggle("kartfri", on);
    if (!on && kartLag) { kartLag.remove(); kartLag = null; }
    if (on) {
      if (cur && !cur.dead) { leave(cur, 0, 0); cur.dead = true; }
      if (!kartLag) {
        kartLag = doc.createElement("section");
        kartLag.className = "scene sc-kart lay-overview in kartlag";
        kartLag.innerHTML = kartLabels(false);
        stage.appendChild(kartLag);
      }
      wa = $$(".wa", kartLag).map((w) => ({ el: w, x: +w.dataset.wx, y: +w.dataset.wy, vis: true }));
      const t = camOverview(false);
      t.cy -= (H * 0.04) / t.z;
      flyTo(t, durFor(t), Math.max(prog, 1));
      body.classList.add("is-overview");
      body.dataset.tema = "dark";
      ST.forEach((x) => x.node.el.classList.remove("cur"));
      $(".hd", hud).textContent = "Hele perioden";
      if (state.mode === "utf") renderUbar();
    }
  }

  function openPanel(tab, arg) {
    if (state.mode !== "utf") setMode("utf");
    state.tab = tab;
    panel.hidden = false;
    panel.innerHTML = `<div class="pn-in">${PANELS[tab](arg)}</div><button class="pn-x" data-act="lukk" aria-label="Lukk">Lukk <kbd>Esc</kbd></button>`;
    panel.scrollTop = 0;
    root.classList.add("panel-open");
    renderUbar();
    const f = $("input, button", panel); if (f) f.focus({ preventScroll: true });
  }
  function closePanel() {
    if (panel.hidden) return;
    panel.hidden = true; panel.innerHTML = ""; state.tab = null;
    root.classList.remove("panel-open");
    if (state.mode === "utf") renderUbar();
  }

  function oppslagFor(s) {
    const m = s.data && D.MILEPAELER[s.data];
    const li = (arr) => `<ul>${arr.map((x) => `<li>${fmt(x.tekst || x)}${x.type ? " " + tag(x.type, x.kontroller) : ""}</li>`).join("")}</ul>`;
    switch (s.scene) {
      case "milepael": return `<p>${fmt(m.ingress)}</p><p class="op-k">${fmt(m.naarEtikett)}: ${fmt(m.naar)}</p>${li(m.sjekkliste)}${fact(m.fakta)}`;

      const a = act.dataset.act;
      if (a === "utf") setMode(state.mode === "utf" ? "pres" : "utf");
      else if (a === "pres") setMode("pres");
      else if (a === "fs") fullscreen();
      else if (a === "rm") setRM(!RM);
      else if (a === "help") toggleHelp();
      else if (a === "prev") prev();
      else if (a === "next") next();
      else if (a === "lukk") closePanel();
      else if (a === "norolle") setRolle(null);
      else if (a === "print") window.print();
      else if (a === "lagre") lagreFil();
      else if (a === "json") lastNed("lokalt.json", JSON.stringify(LOKALT, null, 2), "application/json");
      else if (a === "redig") { closePanel(); setRedig(true); }
      else if (a === "nullstill") { if (confirm("Fjerne alle svar som er fylt inn i denne nettleseren?")) { LOKALT = Object.assign({}, LOKALT_FIL); store.set("lokalt", {}); rerender(); openPanel("plass"); } }
      return;
    }
    const tab = t.closest("[data-tab]");
    if (tab) { const v = tab.dataset.tab; if (v === "kart") { closePanel(); setKartFri(true); } else openPanel(v); return; }
    const pr = t.closest("[data-panrolle]");
    if (pr) { openPanel("ansvar", pr.dataset.panrolle); return; }
    const hl = t.closest("[data-hl]");
    if (hl && !t.closest(".scene")) { setRolle(state.rolle === hl.dataset.hl ? null : hl.dataset.hl); if (state.tab === "ansvar") openPanel("ansvar", hl.dataset.hl); return; }
    const fo = t.closest("[data-form]");
    if (fo) { setForm(fo.dataset.form || null); if (state.tab === "oppslag") openPanel("oppslag"); return; }
    const ro = t.closest("[data-rolle]");
    if (ro) { setRolle(ro.dataset.rolle || null); if (state.tab === "oppslag") openPanel("oppslag"); return; }
    const go = t.closest("[data-go]");
    if (go) { e.preventDefault(); const was = state.kartFri; goId(go.dataset.go); if (was) renderUbar(); return; }
    const stn = t.closest(".stn");
    if (stn && !drag.moved) { goTo(+stn.dataset.i, fullt(+stn.dataset.i)); if (state.mode === "utf") renderUbar(); return; }
    const pg = t.closest(".pg-t");
    if (pg) { goTo(+pg.dataset.i, fullt(+pg.dataset.i)); if (state.mode === "utf") renderUbar(); }
  });
  let phT;
  panel.addEventListener("input", (e) => {
    if (e.target.classList.contains("ph-in")) {
      const t = e.target;
      clearTimeout(phT); phT = setTimeout(() => setLokal(t.dataset.key, t.value), 350);
      return;
    }
    if (e.target.classList.contains("pn-q")) {
      state.q = e.target.value;
      const pos = e.target.selectionStart;
      openPanel("oppslag");
      const q = $(".pn-q", panel); q.focus(); q.setSelectionRange(pos, pos);
    }
  });

  // Fri navigering i kartet: dra for å panorere, rull for å zoome.
  const drag = { on: false, moved: false, x: 0, y: 0 };
  app.addEventListener("pointerdown", (e) => {
    if (!state.kartFri || e.button !== 0 || e.target.closest("#hud, #ubar, #panel, .scene button, .scene a")) return;
    drag.on = true; drag.moved = false; drag.x = e.clientX; drag.y = e.clientY; tween = null;
  });
  window.addEventListener("pointermove", (e) => {
    wake();
    if (!drag.on) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
    cam.cx -= dx / cam.z; cam.cy -= dy / cam.z; drag.x = e.clientX; drag.y = e.clientY; dirty = true;
  });
  window.addEventListener("pointerup", () => { drag.on = false; setTimeout(() => (drag.moved = false), 0); });

  let wheelAcc = 0, wheelLock = 0;
  window.addEventListener("wheel", (e) => {
    if (e.target.closest("#panel")) return;
    if (state.kartFri) {
      e.preventDefault(); tween = null;
      const f = Math.exp(-e.deltaY * 0.0016), oz = camOverview(false).z;
      const nz = clamp(cam.z * f, oz * 0.7, 1.4 * S);
      const wx = cam.cx + (e.clientX - W / 2) / cam.z, wy = cam.cy + (e.clientY - H / 2) / cam.z;
      cam.cx = wx - (e.clientX - W / 2) / nz; cam.cy = wy - (e.clientY - H / 2) / nz; cam.z = nz; dirty = true;
      return;
    }
    // La innhold som kan rulle, rulle (små skjermer).
    let n = e.target;
    while (n && n !== doc.body) { if (n.scrollHeight > n.clientHeight + 2 && /(auto|scroll)/.test(getComputedStyle(n).overflowY)) { const atEnd = e.deltaY > 0 ? n.scrollTop + n.clientHeight >= n.scrollHeight - 2 : n.scrollTop <= 0; if (!atEnd) return; } n = n.parentElement; }
    const now = performance.now();
    if (now < wheelLock) return;
    wheelAcc += e.deltaY;
    if (Math.abs(wheelAcc) > 70) { wheelAcc > 0 ? next() : prev(); wheelAcc = 0; wheelLock = now + 650; }
  }, { passive: false });

  let touch = null;
  window.addEventListener("touchstart", (e) => { if (e.touches.length === 1 && !state.kartFri) touch = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() }; }, { passive: true });
  window.addEventListener("touchend", (e) => {
    if (!touch || !panel.hidden) return;
    const t = e.changedTouches[0], dx = t.clientX - touch.x, dy = t.clientY - touch.y;
    if (Date.now() - touch.t < 600 && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4) dx < 0 ? next() : prev();
    touch = null;
  });

  window.addEventListener("resize", () => {
    measure();
    if (state.kartFri) { const t = camOverview(false); cam.cx = t.cx; cam.cy = t.cy; cam.z = t.z; }
    else if (cur && !cur.dead) { const t = camTarget(cur.stop, cur.step); flyTo(t, 0, progTarget(cur.stop, cur.step)); setStageVars(cur.el, cur.stop, t); }
  });
  window.addEventListener("hashchange", () => { const [id, st0] = location.hash.slice(1).split("/"); if (IDX[id] != null && (!cur || cur.stop.id !== id)) goTo(IDX[id], +st0 || 0); });

  /* ---------------------------------------------------------------------
     Start
     --------------------------------------------------------------------- */
  measure();
  buildHUD();
  setRM(RM);
  requestAnimationFrame(frame);
  const [hid, hst] = location.hash.slice(1).split("/");
  if (IDX[hid] != null) {
    goTo(IDX[hid], +hst || 0, { instant: true });
  } else {
    // Åpningen: linja tegnes inn fra venstre mens «2026» reiser seg.
    const t = camTarget(ST[0], 0);
    cam.cx = t.cx; cam.cy = t.cy; cam.z = t.z; prog = 0;
    goTo(0, 0, { instant: true });
    prog = 0;
    flyTo(t, RM ? 0 : 2400, progTarget(ST[0], 0));
  }
  root.classList.add("startet");
  wake();
})();

</script>
</body>
</html>
