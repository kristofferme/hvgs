/* ------------------------------------------------------------------
   Fiske og fangst Vg2 – grunnmur
   Identiteten er hentet fra sjøkartet: dypvannshvitt, grunne blåtoner,
   landgult, kartmagenta for all navigasjonsinformasjon og overlevings-
   oransje for sikkerhet. Natt-temaet følger broas nattpalett: mørkt,
   dempet og uten skarpe hvitflater som ødelegger nattsynet.
   ------------------------------------------------------------------ */

:root {
  color-scheme: light;

  /* Flater */
  --papir: #f5f8f9;          /* dypt vann – kartets hvite */
  --flate: #ffffff;
  --flate-2: #eef3f5;
  --grunt: #d9eaf3;          /* grunt vann, 0–10 m */
  --grunt-2: #b9d7e8;        /* grunnere */
  --land: #ecdcab;           /* land på sjøkartet */
  --land-2: #d8c285;

  /* Blekk */
  --blekk: #0f1c27;
  --blekk-2: #3b4c5a;
  --blekk-3: #5a6a77;
  --linje: #c8d5dd;
  --linje-2: #a7b8c3;

  /* Signal */
  --magenta: #a0106c;        /* kartmagenta: fyr, merknader, kurslinje */
  --magenta-flate: #f6e3ef;
  --oransje: #f0561d;        /* overlevingsdrakt, redningsutstyr */
  --oransje-tekst: #b33b0b;
  --oransje-flate: #fde8de;
  --babord: #c8102e;
  --babord-flate: #fbe4e7;
  --styrbord: #0b7a4b;
  --styrbord-flate: #dff2e8;
  --gul: #f4c20d;            /* kardinalmerker, faresymbol */
  --paabud: #1f5fa8;         /* ISO 7010 påbudsskilt */

  /* Illustrasjon */
  --skrog: #22405e;
  --bunnstoff: #a83a2e;
  --overbygg: #ffffff;
  --dekk: #9aa9b3;
  --tau: #c9a25b;
  --garn: #3d6f5a;
  --fisk: #8c9aa3;
  --fisk-lys: #dfe5e8;
  --sjo: #cfe4f0;
  --sjo-dyp: #9cc3db;
  --bunn: #c9b98d;
  --natt: #0c1620;

  /* Typografi */
  --f-display: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", sans-serif-condensed, sans-serif;
  --f-tekst: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --f-sjablong: "Big Shoulders Stencil Display", "Barlow Condensed", Impact, sans-serif;

  --t-xs: 0.75rem;
  --t-s: 0.875rem;
  --t-b: 1.0625rem;
  --t-m: 1.25rem;
  --t-l: 1.625rem;
  --t-xl: clamp(1.9rem, 3.4vw, 2.5rem);
  --t-xxl: clamp(2.6rem, 6.2vw, 4.9rem);

  /* Mellomrom */
  --m1: 4px; --m2: 8px; --m3: 12px; --m4: 16px; --m5: 24px; --m6: 32px; --m7: 48px; --m8: 72px; --m9: 112px;

  --maal: 68ch;
  --side: 1240px;
  --r: 3px;
  --skygge: 0 1px 0 rgba(15, 28, 39, .06), 0 6px 18px -8px rgba(15, 28, 39, .18);
  --fart: 160ms;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --papir: #091017;
    --flate: #0f1922;
    --flate-2: #14212c;
    --grunt: #132b3a;
    --grunt-2: #1b3b50;
    --land: #3a3423;
    --land-2: #5a4f30;
    --blekk: #dfe8ee;
    --blekk-2: #a6b6c2;
    --blekk-3: #7d8e9a;
    --linje: #22323f;
    --linje-2: #2f4352;
    --magenta: #ef7ac0;
    --magenta-flate: #3a1730;
    --oransje: #ff7a44;
    --oransje-tekst: #ff9a6e;
    --oransje-flate: #3a1d10;
    --babord: #ff6b7d;
    --babord-flate: #3b1419;
    --styrbord: #4fd39a;
    --styrbord-flate: #10301f;
    --gul: #e9bd2a;
    --paabud: #5b9be6;
    --skrog: #5c7d9d;
    --bunnstoff: #b35a4f;
    --overbygg: #c7d3db;
    --dekk: #52636f;
    --tau: #a88a50;
    --garn: #5e9a80;
    --fisk: #7d8f9b;
    --fisk-lys: #3b4a55;
    --sjo: #10283a;
    --sjo-dyp: #0b1d2b;
    --bunn: #4b4430;
    --natt: #03070b;
    --skygge: 0 1px 0 rgba(0, 0, 0, .4), 0 8px 24px -10px rgba(0, 0, 0, .6);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --papir: #091017;
  --flate: #0f1922;
  --flate-2: #14212c;
  --grunt: #132b3a;
  --grunt-2: #1b3b50;
  --land: #3a3423;
  --land-2: #5a4f30;
  --blekk: #dfe8ee;
  --blekk-2: #a6b6c2;
  --blekk-3: #7d8e9a;
  --linje: #22323f;
  --linje-2: #2f4352;
  --magenta: #ef7ac0;
  --magenta-flate: #3a1730;
  --oransje: #ff7a44;
  --oransje-tekst: #ff9a6e;
  --oransje-flate: #3a1d10;
  --babord: #ff6b7d;
  --babord-flate: #3b1419;
  --styrbord: #4fd39a;
  --styrbord-flate: #10301f;
  --gul: #e9bd2a;
  --paabud: #5b9be6;
  --skrog: #5c7d9d;
  --bunnstoff: #b35a4f;
  --overbygg: #c7d3db;
  --dekk: #52636f;
  --tau: #a88a50;
  --garn: #5e9a80;
  --fisk: #7d8f9b;
  --fisk-lys: #3b4a55;
  --sjo: #10283a;
  --sjo-dyp: #0b1d2b;
  --bunn: #4b4430;
  --natt: #03070b;
  --skygge: 0 1px 0 rgba(0, 0, 0, .4), 0 8px 24px -10px rgba(0, 0, 0, .6);
}

*, *::before, *::after { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  scroll-padding-top: 88px;
}

body {
  margin: 0;
  background: var(--papir);
  color: var(--blekk);
  font-family: var(--f-tekst);
  font-size: var(--t-b);
  line-height: 1.6;
  font-feature-settings: "kern";
  -webkit-font-smoothing: antialiased;
  overflow-x: clip;
}

img, svg { max-width: 100%; }
svg { display: block; }
[hidden] { display: none !important; }

h1, h2, h3, h4 {
  font-family: var(--f-display);
  font-weight: 700;
  line-height: 1.02;
  letter-spacing: -0.005em;
  margin: 0;
  text-wrap: balance;
}

p { margin: 0; }
p + p { margin-top: 0.85em; }

a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 0.18em; }
a:hover { color: var(--magenta); }

button { font: inherit; color: inherit; }

:focus-visible {
  outline: 2px solid var(--magenta);
  outline-offset: 3px;
  border-radius: 1px;
}

::selection { background: var(--magenta); color: #fff; }

.mono { font-family: var(--f-mono); font-feature-settings: "tnum"; letter-spacing: 0; }
.tall { font-variant-numeric: tabular-nums; }

.etikett {
  font-family: var(--f-display);
  font-weight: 600;
  font-size: var(--t-s);
  text-transform: uppercase;
  letter-spacing: 0.09em;
  line-height: 1.2;
}

.skjult-visuelt {
  position: absolute !important;
  width: 1px; height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

/* ------------------------------------------------------------------
   Skall: toppstripe, navigasjon, sidebredder, forside og modulsider
   ------------------------------------------------------------------ */

.ramme {
  width: 100%;
  max-width: var(--side);
  margin-inline: auto;
  padding-inline: clamp(16px, 4vw, 40px);
}

/* Kartrammens gradskala – den svart-hvite minuttstigen langs kanten
   av et sjøkart. Brukes som signatur øverst og rundt kart. */
.skala {
  height: 9px;
  border-block: 1px solid var(--blekk);
  background:
    repeating-linear-gradient(90deg, var(--blekk) 0 36px, transparent 36px 72px) 0 50% / 100% 3px no-repeat,
    var(--flate);
}

.topp {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 50;
  background: color-mix(in srgb, var(--papir) 92%, transparent);
  backdrop-filter: saturate(1.4) blur(10px);
  -webkit-backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--linje);
}

.topp-inner {
  display: flex;
  align-items: center;
  gap: var(--m5);
  min-height: 60px;
}

.merke {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  flex-shrink: 0;
}
.merke svg { width: 34px; height: 22px; color: var(--magenta); }
.merke-navn {
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 1.28rem;
  letter-spacing: 0.01em;
  line-height: 1;
}
.merke-vg {
  font-family: var(--f-sjablong);
  font-size: 1.28rem;
  line-height: 1;
  color: var(--magenta);
  margin-left: 2px;
}

.hovednav {
  display: flex;
  gap: 2px;
  margin-left: auto;
  align-items: center;
}
.hovednav a {
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 0.98rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  text-decoration: none;
  padding: 8px 10px;
  border-radius: var(--r);
  color: var(--blekk-2);
  white-space: nowrap;
}
.hovednav a:hover { color: var(--blekk); background: var(--flate-2); }
.hovednav a[aria-current="page"] {
  color: var(--blekk);
  box-shadow: inset 0 -2px 0 var(--magenta);
  border-radius: 0;
}

.topp-knapper { display: flex; gap: 6px; align-items: center; }

.ikon-knapp {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 36px;
  padding: 0 12px;
  border: 1px solid var(--linje-2);
  background: var(--flate);
  border-radius: var(--r);
  cursor: pointer;
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 0.9rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--blekk-2);
  transition: border-color var(--fart), color var(--fart);
}
.ikon-knapp:hover { border-color: var(--blekk); color: var(--blekk); }
.ikon-knapp svg { width: 16px; height: 16px; }
.meny-knapp { display: none; }

@media (max-width: 1060px) {
  .hovednav { display: none; }
  .meny-knapp { display: inline-flex; margin-left: auto; }
  .hovednav.apen {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    position: absolute;
    top: 100%;
    left: 0; right: 0;
    background: var(--flate);
    border-bottom: 1px solid var(--linje);
    padding: 8px clamp(16px, 4vw, 40px) 16px;
    box-shadow: var(--skygge);
  }
  .hovednav.apen a { padding: 14px 4px; border-bottom: 1px solid var(--linje); font-size: 1.1rem; }
  .hovednav.apen a[aria-current="page"] { box-shadow: inset 3px 0 0 var(--magenta); padding-left: 12px; }
}
@media (max-width: 460px) {
  .tema-tekst { display: none; }
  .merke-navn { font-size: 1.12rem; }
}

main { display: block; min-height: 70vh; }

/* ---------- Knapper ---------- */

.knapp {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 46px;
  padding: 0 20px;
  border: 1.5px solid var(--blekk);
  background: var(--blekk);
  color: var(--papir);
  border-radius: var(--r);
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 1.02rem;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
  transition: background var(--fart), border-color var(--fart), color var(--fart);
}
.knapp:hover { background: var(--magenta); border-color: var(--magenta); color: #fff; }
.knapp.sekundar { background: transparent; color: var(--blekk); }
.knapp.sekundar:hover { background: var(--blekk); color: var(--papir); border-color: var(--blekk); }
.knapp.liten { min-height: 36px; padding: 0 14px; font-size: 0.9rem; }
.knapp svg { width: 18px; height: 18px; }
.knapp[disabled] { opacity: .45; cursor: not-allowed; }

.lenkepil {
  font-family: var(--f-display);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  font-size: 0.95rem;
  text-decoration: none;
  display: inline-flex;
  gap: 6px;
  align-items: center;
  color: var(--magenta);
}
.lenkepil::after { content: "→"; font-family: var(--f-tekst); transition: transform var(--fart); }
.lenkepil:hover::after { transform: translateX(3px); }

.brikke {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 24px;
  padding: 0 8px;
  border: 1px solid var(--linje-2);
  border-radius: 2px;
  font-family: var(--f-mono);
  font-size: 0.74rem;
  font-weight: 500;
  color: var(--blekk-2);
  background: var(--flate);
  white-space: nowrap;
  text-decoration: none;
}
a.brikke:hover { border-color: var(--magenta); color: var(--magenta); }
.brikke.fylt { background: var(--blekk); border-color: var(--blekk); color: var(--papir); }

/* ---------- Seksjoner ---------- */

.seksjon { padding-block: var(--m8); }
.seksjon + .seksjon { border-top: 1px solid var(--linje); }

.seksjon-hode {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: end;
  gap: var(--m4) var(--m6);
  margin-bottom: var(--m6);
}
.seksjon-hode h2 { font-size: var(--t-xl); }
.seksjon-hode p { color: var(--blekk-2); max-width: 60ch; margin-top: var(--m3); }
.seksjon-hode .etikett { color: var(--magenta); display: block; margin-bottom: var(--m3); }
@media (max-width: 700px) {
  .seksjon-hode { grid-template-columns: 1fr; }
  .seksjon { padding-block: var(--m7); }
}

/* ---------- Forside ---------- */

.hero {
  display: grid;
  grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
  gap: var(--m7);
  align-items: start;
  padding-block: var(--m7) var(--m8);
}
.hero-tekst { padding-top: var(--m6); }
.hero-tekst .etikett { color: var(--blekk-2); display: flex; flex-wrap: wrap; gap: 6px 14px; }
.hero-tekst .etikett span + span::before { content: "·"; margin-right: 14px; color: var(--linje-2); }
.hero h1 {
  font-size: var(--t-xxl);
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 0.92;
  margin-top: var(--m5);
}
.hero h1 .vg {
  font-family: var(--f-sjablong);
  font-weight: 800;
  color: var(--magenta);
  letter-spacing: 0;
  display: inline-block;
  margin-left: 0.08em;
}
.hero-ingress {
  font-size: var(--t-m);
  line-height: 1.5;
  color: var(--blekk-2);
  margin-top: var(--m5);
  max-width: 34em;
}

.kurs-status {
  margin-top: var(--m6);
  border-top: 2px solid var(--blekk);
  padding-top: var(--m4);
  display: grid;
  gap: var(--m4);
}
.kurs-status-rad {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 2px 16px;
  align-items: baseline;
}
.kurs-status .stor {
  font-family: var(--f-display);
  font-size: 3.2rem;
  font-weight: 800;
  line-height: 0.9;
  font-variant-numeric: tabular-nums;
}
.kurs-status .stor small { font-size: 1.4rem; color: var(--blekk-3); font-weight: 600; }
.kurs-status .neste { color: var(--blekk-2); font-size: var(--t-s); }
.kurs-status .neste strong { color: var(--blekk); font-size: var(--t-b); display: block; }
.kurs-status .knapperad { display: flex; flex-wrap: wrap; gap: var(--m3); }

.fremdrift-strek {
  display: grid;
  grid-template-columns: repeat(18, 1fr);
  gap: 3px;
}
.fremdrift-strek i {
  height: 8px;
  background: var(--linje);
  border-radius: 1px;
}
.fremdrift-strek i.ok { background: var(--magenta); }
.fremdrift-strek i.fk { }

/* Kartet */
.kartfelt {
  position: relative;
  background: var(--flate);
  border: 1px solid var(--blekk);
  padding: 10px;
}
.kartfelt::before {
  content: "";
  position: absolute;
  inset: 3px;
  border: 1px solid var(--blekk);
  pointer-events: none;
}
.kartfelt svg { width: 100%; height: auto; }
.kart-tittel {
  position: absolute;
  right: 26px;
  bottom: 24px;
  background: var(--flate);
  border: 1px solid var(--blekk);
  padding: 10px 14px 12px;
  max-width: 260px;
}
.kart-tittel .etikett { font-size: 0.72rem; color: var(--blekk-3); }
.kart-tittel strong {
  display: block;
  font-family: var(--f-display);
  font-size: 1.35rem;
  line-height: 1.05;
  margin-top: 4px;
}
.kart-tittel span.mono { font-size: 0.72rem; color: var(--blekk-2); display: block; margin-top: 6px; }

@media (max-width: 920px) {
  .hero { grid-template-columns: 1fr; gap: var(--m6); padding-block: var(--m5) var(--m7); }
  .hero-tekst { padding-top: 0; }
  .kart-tittel { position: static; margin-top: 10px; max-width: none; }
}

/* Reiseplan – modulene som etapper */
.reiseplan {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--t-b);
}
.reiseplan th {
  text-align: left;
  font-family: var(--f-mono);
  font-weight: 500;
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--blekk-3);
  padding: 0 12px 10px 0;
  border-bottom: 2px solid var(--blekk);
  white-space: nowrap;
}
.reiseplan td {
  padding: 16px 12px 16px 0;
  border-bottom: 1px solid var(--linje);
  vertical-align: top;
}
.reiseplan tr.rad { cursor: pointer; transition: background var(--fart); }
.reiseplan tr.rad:hover { background: var(--flate); }
.reiseplan tr.rad:hover .rp-tittel a { color: var(--magenta); }
.rp-wp {
  font-family: var(--f-sjablong);
  font-size: 1.7rem;
  line-height: 1;
  width: 74px;
  color: var(--blekk);
  white-space: nowrap;
}
.rp-tittel a {
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 1.34rem;
  line-height: 1.1;
  text-decoration: none;
  display: block;
}
.rp-tittel p { color: var(--blekk-2); font-size: var(--t-s); margin-top: 4px; max-width: 58ch; }
.rp-havn { font-family: var(--f-mono); font-size: 0.8rem; color: var(--blekk-3); white-space: nowrap; }
.rp-maal { display: flex; flex-wrap: wrap; gap: 4px; max-width: 220px; }
.rp-timer { font-family: var(--f-mono); font-size: 0.85rem; white-space: nowrap; font-feature-settings: "tnum"; }
.rp-status { width: 118px; }

.status-pille {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 0.85rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--blekk-3);
  white-space: nowrap;
}
.status-pille::before {
  content: "";
  width: 11px; height: 11px;
  border: 1.5px solid currentColor;
  border-radius: 50%;
}
.status-pille.paavei { color: var(--oransje-tekst); }
.status-pille.paavei::before { background: linear-gradient(90deg, currentColor 50%, transparent 50%); }
.status-pille.ok { color: var(--styrbord); }
.status-pille.ok::before { background: currentColor; }

@media (max-width: 820px) {
  .reiseplan thead { display: none; }
  .reiseplan, .reiseplan tbody, .reiseplan tr, .reiseplan td { display: block; width: 100%; }
  .reiseplan tr.rad {
    display: grid;
    grid-template-columns: 66px minmax(0, 1fr);
    gap: 4px 12px;
    padding: 16px 0;
    border-bottom: 1px solid var(--linje);
  }
  .reiseplan td { border: 0; padding: 0; }
  .rp-wp { grid-row: span 4; width: auto; }
  .rp-maal { max-width: none; }
  .rp-status { width: auto; }
}

.programfag-hode {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 8px 20px;
  margin: var(--m7) 0 var(--m4);
}
.programfag-hode:first-child { margin-top: 0; }
.programfag-hode h3 { font-size: var(--t-l); }
.programfag-hode .mono { color: var(--blekk-3); font-size: 0.8rem; }

/* Verktøykasse */
.verktoy-rutenett {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: var(--m4);
}
.verktoy-kort {
  display: grid;
  grid-template-rows: auto 1fr;
  background: var(--flate);
  border: 1px solid var(--linje);
  border-radius: var(--r);
  text-decoration: none;
  overflow: hidden;
  transition: border-color var(--fart), transform var(--fart);
}
.verktoy-kort:hover { border-color: var(--blekk); color: inherit; }
.verktoy-kort .vk-bilde {
  aspect-ratio: 16 / 9;
  background: var(--natt);
  border-bottom: 1px solid var(--linje);
  display: grid;
  place-items: center;
  overflow: hidden;
}
.verktoy-kort .vk-bilde.lys { background: var(--grunt); }
.verktoy-kort .vk-bilde svg { width: 100%; height: 100%; }
.verktoy-kort .vk-tekst { padding: 14px 16px 18px; }
.verktoy-kort h3 { font-size: 1.3rem; }
.verktoy-kort p { color: var(--blekk-2); font-size: var(--t-s); margin-top: 6px; line-height: 1.5; }
.verktoy-kort .etikett { color: var(--magenta); font-size: 0.72rem; margin-bottom: 6px; display: block; }

/* Om bord-kort */
.lommekort-rad {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: var(--m4);
}
.lommekort {
  border: 2px solid var(--blekk);
  background: var(--flate);
  padding: 18px 18px 20px;
  text-decoration: none;
  display: grid;
  gap: 8px;
  align-content: start;
  position: relative;
  transition: background var(--fart);
}
.lommekort:hover { background: var(--flate-2); color: inherit; }
.lommekort .lk-kode {
  font-family: var(--f-mono);
  font-size: 0.72rem;
  color: var(--blekk-3);
  letter-spacing: 0.04em;
}
.lommekort h3 { font-size: 1.55rem; }
.lommekort p { font-size: var(--t-s); color: var(--blekk-2); line-height: 1.5; }
.lommekort.nod { border-color: var(--oransje); }
.lommekort.nod h3 { color: var(--oransje-tekst); }

/* ---------- Modulside ---------- */

.modul-topp {
  position: relative;
  border-bottom: 1px solid var(--linje);
  background: var(--flate);
  overflow: hidden;
}
.modul-topp .dybdekurver {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  color: var(--grunt-2);
}
.modul-topp-inner {
  position: relative;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: var(--m4) var(--m6);
  padding-block: var(--m7) var(--m6);
  align-items: end;
}
.modul-kode {
  font-family: var(--f-sjablong);
  font-size: clamp(4.2rem, 11vw, 9rem);
  line-height: 0.8;
  color: var(--blekk);
  letter-spacing: -0.01em;
  display: flex;
  flex-direction: column;
}
.modul-kode small {
  font-family: var(--f-mono);
  font-size: 0.78rem;
  letter-spacing: 0.04em;
  color: var(--blekk-3);
  line-height: 1.2;
  margin-bottom: 14px;
}
.modul-kode .kode-nr { color: var(--magenta); }
.modul-overskrift .smuler {
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 0.9rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--blekk-3);
  display: flex;
  flex-wrap: wrap;
  gap: 6px 10px;
}
.modul-overskrift .smuler a { text-decoration: none; color: var(--blekk-2); }
.modul-overskrift .smuler a:hover { color: var(--magenta); }
.modul-overskrift h1 {
  font-size: var(--t-xxl);
  font-weight: 800;
  letter-spacing: -0.018em;
  line-height: 0.95;
  margin-top: var(--m3);
}
.modul-overskrift .undertittel {
  font-size: var(--t-m);
  color: var(--blekk-2);
  margin-top: var(--m4);
  max-width: 44em;
  line-height: 1.45;
}
.modul-meta {
  grid-column: 1 / -1;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--m3) var(--m5);
  padding-top: var(--m5);
  margin-top: var(--m3);
  border-top: 1px solid var(--linje);
}
.modul-meta .meta-felt { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.modul-meta .meta-felt > .etikett { font-size: 0.75rem; color: var(--blekk-3); }
.modul-meta .knapper { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

@media (max-width: 720px) {
  .modul-topp-inner { grid-template-columns: 1fr; padding-block: var(--m6) var(--m5); }
  .modul-kode { flex-direction: row; align-items: baseline; gap: 12px; font-size: 3.6rem; }
  .modul-kode small { margin: 0; }
  .modul-meta .knapper { margin-left: 0; }
}

.modul-kropp {
  display: grid;
  grid-template-columns: 230px minmax(0, 1fr);
  gap: var(--m7);
  padding-block: var(--m7) var(--m8);
}
.modul-side {
  position: sticky;
  top: 92px;
  align-self: start;
  display: grid;
  gap: var(--m5);
  max-height: calc(100vh - 110px);
  overflow: auto;
  padding-right: 4px;
}
.innholdsliste { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--linje); }
.innholdsliste a {
  display: block;
  padding: 6px 0 6px 14px;
  margin-left: -1px;
  border-left: 2px solid transparent;
  text-decoration: none;
  font-size: var(--t-s);
  color: var(--blekk-2);
  line-height: 1.35;
}
.innholdsliste a:hover { color: var(--blekk); border-left-color: var(--linje-2); }
.innholdsliste a.aktiv { color: var(--blekk); border-left-color: var(--magenta); font-weight: 700; }
.innholdsliste .er-ovelse a::before {
  content: "";
  display: inline-block;
  width: 7px; height: 7px;
  transform: rotate(45deg) translateY(-1px);
  border: 1.5px solid var(--magenta);
  margin-right: 8px;
}
.modul-side .etikett { color: var(--blekk-3); font-size: 0.74rem; margin-bottom: 8px; display: block; }

.modul-hoved { min-width: 0; }
.modul-hoved > * + * { margin-top: var(--m6); }
.modul-hoved > h2 {
  font-size: var(--t-xl);
  margin-top: var(--m8);
  padding-top: var(--m5);
  border-top: 2px solid var(--blekk);
  display: flex;
  gap: 16px;
  align-items: baseline;
  max-width: var(--maal);
}
.modul-hoved > h2 .h-nr {
  font-family: var(--f-mono);
  font-size: 0.9rem;
  font-weight: 500;
  color: var(--magenta);
  letter-spacing: 0;
  flex-shrink: 0;
}
.modul-hoved > h2:first-child { margin-top: 0; }
.modul-hoved > h2 + * { margin-top: var(--m5); }
.modul-hoved > h3 { font-size: var(--t-l); margin-top: var(--m7); max-width: var(--maal); }
.modul-hoved > h3 + * { margin-top: var(--m3); }
.modul-hoved > p,
.modul-hoved > ul,
.modul-hoved > ol,
.tekst { max-width: var(--maal); }
.modul-hoved > ul, .modul-hoved > ol { padding-left: 1.2em; }
.modul-hoved li + li { margin-top: 0.4em; }
.modul-hoved strong { font-weight: 700; }

.modul-slutt {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--m4);
  margin-top: var(--m8) !important;
  padding-top: var(--m5);
  border-top: 2px solid var(--blekk);
}
.modul-slutt a {
  display: grid;
  gap: 4px;
  padding: 16px 18px;
  border: 1px solid var(--linje);
  background: var(--flate);
  text-decoration: none;
  border-radius: var(--r);
}
.modul-slutt a:hover { border-color: var(--blekk); color: inherit; }
.modul-slutt a .etikett { font-size: 0.75rem; color: var(--blekk-3); }
.modul-slutt a strong { font-family: var(--f-display); font-size: 1.3rem; line-height: 1.1; }
.modul-slutt a.neste { text-align: right; }
.modul-slutt .fullfor {
  grid-column: 1 / -1;
  display: flex;
  flex-wrap: wrap;
  gap: 12px 20px;
  align-items: center;
  justify-content: space-between;
  padding: 18px 20px;
  background: var(--grunt);
  border-radius: var(--r);
}
.modul-slutt .fullfor p { max-width: 52ch; font-size: var(--t-s); }

@media (max-width: 1000px) {
  .modul-kropp { grid-template-columns: 1fr; gap: var(--m5); padding-top: var(--m5); }
  .modul-side { position: static; max-height: none; overflow: visible; }
  .modul-side .innholdsliste { display: flex; flex-wrap: wrap; gap: 4px 8px; border: 0; }
  .modul-side .innholdsliste li a { border: 1px solid var(--linje); border-radius: 2px; padding: 5px 10px; margin: 0; background: var(--flate); }
  .modul-side .innholdsliste li a.aktiv { border-color: var(--magenta); }
  .modul-side .kanjeg-mini { display: none; }
}
@media (max-width: 560px) {
  .modul-slutt { grid-template-columns: 1fr; }
  .modul-slutt a.neste { text-align: left; }
}

/* ---------- Oversiktssider (programfag, verktøy, ordliste, lærer) ---------- */

.sidetopp {
  padding-block: var(--m7) var(--m6);
  border-bottom: 1px solid var(--linje);
  background: var(--flate);
  position: relative;
  overflow: hidden;
}
.sidetopp .dybdekurver { position: absolute; inset: 0; width: 100%; height: 100%; color: var(--grunt-2); pointer-events: none; }
.sidetopp .ramme { position: relative; }
.sidetopp .etikett { color: var(--magenta); }
.sidetopp h1 {
  font-size: var(--t-xxl);
  font-weight: 800;
  letter-spacing: -0.018em;
  line-height: 0.95;
  margin-top: var(--m3);
}
.sidetopp p { font-size: var(--t-m); color: var(--blekk-2); max-width: 46em; margin-top: var(--m4); line-height: 1.45; }

/* ---------- Bunntekst ---------- */

.bunn {
  margin-top: var(--m8);
  border-top: 1px solid var(--blekk);
  background: var(--flate);
  font-size: var(--t-s);
  color: var(--blekk-2);
}
.bunn-inner {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr;
  gap: var(--m6);
  padding-block: var(--m6) var(--m7);
}
.bunn h4 { font-size: 1rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--blekk); margin-bottom: 10px; font-weight: 700; }
.bunn ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.bunn .koordinat { font-family: var(--f-mono); font-size: 0.78rem; color: var(--blekk-3); margin-top: 12px; }
@media (max-width: 760px) { .bunn-inner { grid-template-columns: 1fr; } }

/* Toast */
.melding {
  position: fixed;
  left: 50%;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 20px);
  background: var(--blekk);
  color: var(--papir);
  padding: 12px 18px;
  border-radius: var(--r);
  font-weight: 700;
  font-size: var(--t-s);
  opacity: 0;
  pointer-events: none;
  transition: opacity 200ms, transform 200ms;
  z-index: 80;
  max-width: calc(100vw - 32px);
}
.melding.vis { opacity: 1; transform: translate(-50%, 0); }

/* ------------------------------------------------------------------
   Innholdsblokker i modulene
   ------------------------------------------------------------------ */

.ingress {
  font-size: var(--t-m);
  line-height: 1.5;
  max-width: 40em;
}

/* Kort fortalt – landgult felt, posisjonsmerker som punkt */
.kort-fortalt {
  background: var(--land);
  color: var(--blekk);
  padding: 22px 24px 24px;
  border-radius: var(--r);
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 12px;
  max-width: var(--maal);
}
.kort-fortalt .etikett { font-size: 0.78rem; }
.kort-fortalt ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.kort-fortalt li {
  position: relative;
  padding-left: 28px;
  font-size: 1.08rem;
  line-height: 1.45;
  font-weight: 700;
}
.kort-fortalt li::before {
  content: "";
  position: absolute;
  left: 2px;
  top: 0.42em;
  width: 10px; height: 10px;
  border: 2px solid var(--blekk);
  transform: rotate(45deg);
}
.kort-fortalt .les-hoyt { justify-self: start; }

/* Figurer */
.fig { margin: 0; }
.fig-flate {
  background: var(--flate);
  border: 1px solid var(--linje);
  border-radius: var(--r);
  overflow: hidden;
  position: relative;
}
.fig-flate.natt { background: var(--natt); border-color: var(--natt); }
.fig-flate.sjo { background: var(--sjo); }
.fig-flate > svg { width: 100%; height: auto; }
.fig-rull { overflow-x: auto; }
.fig-rull > svg { min-width: 620px; }
.fig figcaption {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 12px;
  margin-top: 10px;
  font-size: var(--t-s);
  color: var(--blekk-2);
  line-height: 1.45;
  max-width: var(--maal);
}
.fig figcaption .fig-nr {
  font-family: var(--f-mono);
  font-size: 0.75rem;
  color: var(--magenta);
  padding-top: 2px;
  white-space: nowrap;
}
.fig-par { display: grid; grid-template-columns: 1fr 1fr; gap: var(--m4); }
@media (max-width: 640px) { .fig-par { grid-template-columns: 1fr; } }

/* SVG-typografi i figurer */
:where(.fig svg text, .fig-flate svg text, .vk-bilde svg text, .kartfelt svg text, .verktoy-flate svg text), .svgtekst {
  font-family: var(--f-display);
  font-weight: 600;
  fill: var(--blekk);
}
svg .t-liten { font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; }
svg .t-mono { font-family: var(--f-mono); font-weight: 500; font-size: 11px; letter-spacing: 0; }
svg .t-dempet { fill: var(--blekk-3); }
svg .t-magenta { fill: var(--magenta); }

/* Merknader – kartnotat med etikett i rammen */
.notat {
  position: relative;
  border: 1.5px solid var(--blekk);
  border-radius: var(--r);
  padding: 22px 22px 18px;
  max-width: var(--maal);
  background: var(--flate);
  margin-top: calc(var(--m6) + 8px) !important;
}
.notat-etikett {
  position: absolute;
  top: -12px;
  left: 16px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 2px 10px;
  background: var(--blekk);
  color: var(--papir);
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 0.82rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  line-height: 1.5;
  border-radius: 2px;
}
.notat-etikett svg { width: 14px; height: 14px; }
.notat h4 { font-size: 1.28rem; margin-bottom: 6px; }
.notat p, .notat li { font-size: var(--t-b); }
.notat ul { margin: 8px 0 0; padding-left: 1.2em; }
.notat.regel { border-color: var(--magenta); }
.notat.regel .notat-etikett { background: var(--magenta); color: #fff; }
.notat.fare { border-color: var(--oransje); background: var(--oransje-flate); }
.notat.fare .notat-etikett { background: var(--oransje); color: #1a0a02; }
.notat.praksis { border-style: dashed; }
.notat.lokalt { background: var(--grunt); border-color: var(--grunt-2); }
.notat.lokalt .notat-etikett { background: var(--skrog); color: #fff; }

/* Steg – en ekte rekkefølge */
.steg { list-style: none; margin: 0; padding: 0; counter-reset: steg; max-width: var(--maal); }
.steg > li {
  counter-increment: steg;
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr);
  gap: 16px;
  padding: 14px 0;
  border-top: 1px solid var(--linje);
}
.steg > li:last-child { border-bottom: 1px solid var(--linje); }
.steg > li::before {
  content: counter(steg, decimal-leading-zero);
  font-family: var(--f-sjablong);
  font-size: 1.9rem;
  line-height: 1;
  color: var(--magenta);
}
.steg h4 { font-size: 1.22rem; }
.steg p { color: var(--blekk-2); margin-top: 4px; }
.steg-tittel { font-size: var(--t-l); margin-bottom: var(--m3); }

/* Punktliste med merker */
.merkeliste { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; max-width: var(--maal); }
.merkeliste li { position: relative; padding-left: 26px; }
.merkeliste li::before {
  content: "";
  position: absolute;
  left: 3px;
  top: 0.62em;
  width: 7px; height: 7px;
  background: var(--magenta);
  transform: rotate(45deg);
}

/* Tabeller */
.tabell-rull { overflow-x: auto; max-width: 100%; }
.tabell {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--t-s);
  background: var(--flate);
  border: 1px solid var(--linje);
}
.tabell caption {
  text-align: left;
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 1.2rem;
  padding-bottom: 10px;
}
.tabell th, .tabell td { padding: 10px 14px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--linje); }
.tabell th {
  font-family: var(--f-mono);
  font-weight: 500;
  font-size: 0.72rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--blekk-2);
  background: var(--flate-2);
  white-space: nowrap;
}
.tabell td.tall, .tabell th.tall { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--f-mono); font-size: 0.85rem; }
.tabell tbody tr:hover { background: var(--flate-2); }
.tabell .sterk { font-weight: 700; }

/* Begreper */
.begreper {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 0;
  border-top: 2px solid var(--blekk);
}
.begreper div { padding: 12px 16px 14px 0; border-bottom: 1px solid var(--linje); }
.begreper dt { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; }
.begreper dd { margin: 2px 0 0; font-size: var(--t-s); color: var(--blekk-2); line-height: 1.45; }
.begreper .nn { font-family: var(--f-mono); font-size: 0.72rem; color: var(--blekk-3); margin-left: 6px; font-weight: 400; }

/* Tenk / diskuter */
.tenk {
  display: grid;
  grid-template-columns: 40px minmax(0, 1fr);
  gap: 14px;
  max-width: var(--maal);
  padding: 18px 0;
  border-block: 1px dashed var(--linje-2);
}
.tenk svg { width: 34px; height: 34px; color: var(--magenta); }
.tenk .etikett { color: var(--magenta); font-size: 0.78rem; }
.tenk p { margin-top: 4px; }

/* ---------- Øvelser ---------- */

.ovelse {
  background: var(--flate);
  border: 1px solid var(--linje-2);
  border-radius: var(--r);
  padding: 0;
  overflow: hidden;
}
.ovelse-hode {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 16px;
  padding: 14px 20px;
  background: var(--flate-2);
  border-bottom: 1px solid var(--linje);
}
.ovelse-hode .etikett { color: var(--magenta); font-size: 0.8rem; display: inline-flex; gap: 8px; align-items: center; }
.ovelse-hode .etikett::before {
  content: "";
  width: 8px; height: 8px;
  border: 1.5px solid currentColor;
  transform: rotate(45deg);
}
.ovelse-hode h3 { font-size: 1.35rem; width: 100%; }
.ovelse-hode .mono { font-size: 0.78rem; color: var(--blekk-3); }
.ovelse-kropp { padding: 20px; }
.ovelse-fot {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 16px;
  align-items: center;
  padding: 14px 20px;
  border-top: 1px solid var(--linje);
}

/* Quiz */
.quiz-sp { display: grid; gap: 14px; }
.quiz-sp + .quiz-sp { margin-top: 26px; padding-top: 22px; border-top: 1px solid var(--linje); }
.quiz-sporsmal { font-weight: 700; font-size: 1.12rem; line-height: 1.4; display: grid; grid-template-columns: auto 1fr; gap: 12px; }
.quiz-sporsmal .mono { color: var(--blekk-3); font-size: 0.8rem; font-weight: 500; padding-top: 4px; }
.quiz-alt { display: grid; gap: 8px; }
.quiz-alt button {
  display: grid;
  grid-template-columns: 30px minmax(0, 1fr) 22px;
  gap: 12px;
  align-items: center;
  text-align: left;
  padding: 11px 14px;
  border: 1.5px solid var(--linje-2);
  border-radius: var(--r);
  background: var(--papir);
  cursor: pointer;
  line-height: 1.4;
  transition: border-color var(--fart), background var(--fart);
}
.quiz-alt button:hover:not([disabled]) { border-color: var(--blekk); }
.quiz-alt button .bokstav {
  font-family: var(--f-mono);
  font-weight: 600;
  font-size: 0.8rem;
  width: 28px; height: 28px;
  display: grid;
  place-items: center;
  border: 1px solid var(--linje-2);
  border-radius: 2px;
  background: var(--flate);
}
.quiz-alt button[disabled] { cursor: default; }
.quiz-alt button.riktig { border-color: var(--styrbord); background: var(--styrbord-flate); }
.quiz-alt button.riktig .bokstav { background: var(--styrbord); color: #fff; border-color: var(--styrbord); }
.quiz-alt button.feil { border-color: var(--babord); background: var(--babord-flate); }
.quiz-alt button.feil .bokstav { background: var(--babord); color: #fff; border-color: var(--babord); }
.quiz-alt button .merk { font-weight: 700; font-size: 1.1rem; }
.quiz-forkl {
  font-size: var(--t-s);
  color: var(--blekk-2);
  padding: 10px 14px;
  border-left: 3px solid var(--styrbord);
  background: var(--papir);
}
.quiz-forkl.feil { border-left-color: var(--babord); }
.quiz-resultat { font-family: var(--f-display); font-weight: 700; font-size: 1.25rem; }
.quiz-resultat .mono { font-size: 0.85rem; color: var(--blekk-3); font-weight: 500; margin-left: 8px; }

/* Rekkefølge */
.sorter-liste { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.sorter-liste button {
  width: 100%;
  display: grid;
  grid-template-columns: 40px minmax(0, 1fr);
  gap: 12px;
  align-items: center;
  text-align: left;
  padding: 10px 14px;
  border: 1.5px solid var(--linje-2);
  border-radius: var(--r);
  background: var(--papir);
  cursor: pointer;
  line-height: 1.4;
}
.sorter-liste button:hover { border-color: var(--blekk); }
.sorter-liste .plass {
  font-family: var(--f-sjablong);
  font-size: 1.5rem;
  line-height: 1;
  color: var(--linje-2);
  text-align: center;
}
.sorter-liste button.valgt .plass { color: var(--magenta); }
.sorter-liste button.valgt { border-color: var(--magenta); background: var(--magenta-flate); }
.sorter-liste button.riktig { border-color: var(--styrbord); background: var(--styrbord-flate); }
.sorter-liste button.riktig .plass { color: var(--styrbord); }
.sorter-liste button.feil { border-color: var(--babord); background: var(--babord-flate); }
.sorter-liste button.feil .plass { color: var(--babord); }
.sorter-hint { font-size: var(--t-s); color: var(--blekk-2); margin-bottom: 12px; }

/* Regneoppgaver */
.regn-liste { margin: 0; padding-left: 1.3em; display: grid; gap: 18px; }
.regn-liste > li::marker { font-family: var(--f-mono); color: var(--magenta); font-size: .85rem; }
.regn-oppg p:first-child { font-weight: 700; max-width: var(--maal); }
.regn-svar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
.regn-svar input {
  width: 150px; height: 40px; padding: 0 12px;
  border: 1.5px solid var(--blekk); border-radius: var(--r);
  background: var(--papir); color: var(--blekk);
  font-family: var(--f-mono); font-size: 1rem;
}
.regn-svar input.ok { border-color: var(--styrbord); background: var(--styrbord-flate); }
.regn-svar input.feil { border-color: var(--babord); background: var(--babord-flate); }
.regn-enhet { font-family: var(--f-mono); font-size: .9rem; color: var(--blekk-2); min-width: 2ch; }
.regn-tilbake { font-size: var(--t-s); margin-top: 6px; color: var(--blekk-2); max-width: var(--maal); }
.regn-tilbake.ok { color: var(--styrbord); }
.regn-tilbake.feil { color: var(--babord); }
.regn-tilbake strong { color: inherit; }

/* Oppdrag – arbeidsordre */
.oppdrag {
  border: 2px solid var(--blekk);
  background: var(--flate);
  border-radius: 0;
}
.oppdrag-hode {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px 16px;
  padding: 16px 20px;
  border-bottom: 2px solid var(--blekk);
  align-items: start;
}
.oppdrag-hode .etikett { color: var(--blekk-3); font-size: 0.78rem; }
.oppdrag-hode h3 { font-size: 1.5rem; margin-top: 4px; }
.oppdrag-felt {
  display: grid;
  grid-template-columns: repeat(3, auto);
  border: 1px solid var(--blekk);
  font-size: 0.78rem;
}
.oppdrag-felt div { padding: 5px 10px; border-left: 1px solid var(--blekk); }
.oppdrag-felt div:first-child { border-left: 0; }
.oppdrag-felt span { display: block; font-family: var(--f-mono); font-size: 0.66rem; color: var(--blekk-3); text-transform: uppercase; letter-spacing: 0.05em; }
.oppdrag-felt strong { font-family: var(--f-display); font-size: 0.98rem; white-space: nowrap; }
.oppdrag-kropp { padding: 18px 20px 20px; display: grid; gap: 14px; }
.oppdrag-kropp > p { max-width: var(--maal); }
.sjekkliste { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.sjekkliste li { border-top: 1px solid var(--linje); }
.sjekkliste li:last-child { border-bottom: 1px solid var(--linje); }
.sjekkliste label {
  display: grid;
  grid-template-columns: 26px minmax(0, 1fr);
  gap: 12px;
  padding: 11px 2px;
  cursor: pointer;
  align-items: start;
  line-height: 1.45;
}
.sjekkliste input {
  appearance: none;
  -webkit-appearance: none;
  width: 22px; height: 22px;
  margin: 1px 0 0;
  border: 2px solid var(--blekk);
  border-radius: 2px;
  background: var(--flate);
  display: grid;
  place-items: center;
  cursor: pointer;
}
.sjekkliste input::after {
  content: "";
  width: 11px; height: 6px;
  border: 2.5px solid #fff;
  border-top: 0; border-right: 0;
  transform: rotate(-45deg) translate(1px, -1px);
  opacity: 0;
}
.sjekkliste input:checked { background: var(--styrbord); border-color: var(--styrbord); }
.sjekkliste input:checked::after { opacity: 1; }
.sjekkliste input:checked + span { color: var(--blekk-3); text-decoration: line-through; text-decoration-color: var(--linje-2); }
@media (max-width: 560px) {
  .oppdrag-hode { grid-template-columns: 1fr; }
  .oppdrag-felt { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .oppdrag-felt strong { white-space: normal; }
}

/* Kan jeg? */
.kanjeg { display: grid; gap: 0; }
.kanjeg-rad {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 10px 20px;
  align-items: center;
  padding: 12px 0;
  border-top: 1px solid var(--linje);
}
.kanjeg-rad:last-child { border-bottom: 1px solid var(--linje); }
.kanjeg-rad p { line-height: 1.4; }
.kanjeg-valg { display: inline-grid; grid-template-columns: repeat(3, auto); border: 1.5px solid var(--blekk); border-radius: var(--r); overflow: hidden; }
.kanjeg-valg button {
  border: 0;
  border-left: 1.5px solid var(--blekk);
  background: var(--flate);
  padding: 7px 12px;
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 0.86rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  cursor: pointer;
  white-space: nowrap;
}
.kanjeg-valg button:first-child { border-left: 0; }
.kanjeg-valg button:hover { background: var(--flate-2); }
.kanjeg-valg button[aria-pressed="true"][data-v="0"] { background: var(--babord); color: #fff; }
.kanjeg-valg button[aria-pressed="true"][data-v="1"] { background: var(--gul); color: #1a1400; }
.kanjeg-valg button[aria-pressed="true"][data-v="2"] { background: var(--styrbord); color: #fff; }
@media (max-width: 620px) { .kanjeg-rad { grid-template-columns: 1fr; } }

.kanjeg-mini { display: grid; gap: 6px; }
.kanjeg-mini .rad { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
.kanjeg-mini i { height: 6px; background: var(--linje); border-radius: 1px; }
.kanjeg-mini i.v1 { background: var(--gul); }
.kanjeg-mini i.v2 { background: var(--styrbord); }
.kanjeg-mini p { font-size: 0.8rem; color: var(--blekk-3); }

/* Hotspot-figur */
.hotspot { position: relative; }
.hotspot-punkt {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 2px solid var(--flate);
  background: var(--magenta);
  color: #fff;
  font-family: var(--f-mono);
  font-weight: 600;
  font-size: 0.75rem;
  cursor: pointer;
  display: grid;
  place-items: center;
  box-shadow: 0 0 0 1px var(--magenta), 0 3px 10px rgba(0,0,0,.25);
  transition: transform var(--fart);
  padding: 0;
}
.hotspot-punkt:hover, .hotspot-punkt[aria-expanded="true"] { transform: translate(-50%, -50%) scale(1.15); background: var(--blekk); box-shadow: 0 0 0 1px var(--blekk), 0 3px 10px rgba(0,0,0,.25); }
.hotspot-punkt.sett { background: var(--flate); color: var(--magenta); }
.hotspot-info {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 4px 14px;
  padding: 14px 18px;
  border-top: 1px solid var(--linje);
  background: var(--flate);
  min-height: 76px;
  align-items: start;
}
.hotspot-info .nr {
  grid-row: span 2;
  font-family: var(--f-sjablong);
  font-size: 2rem;
  line-height: 1;
  color: var(--magenta);
}
.hotspot-info strong { font-family: var(--f-display); font-size: 1.2rem; line-height: 1.1; }
.hotspot-info p { font-size: var(--t-s); color: var(--blekk-2); }
.hotspot-teller { font-family: var(--f-mono); font-size: 0.75rem; color: var(--blekk-3); }

/* Kilder */
.kilder { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; max-width: var(--maal); }
.kilder li { padding: 10px 0; border-top: 1px solid var(--linje); display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 14px; font-size: var(--t-s); }
.kilder li:last-child { border-bottom: 1px solid var(--linje); }
.kilder .mono { font-size: 0.72rem; color: var(--blekk-3); text-transform: uppercase; padding-top: 2px; }
@media (max-width: 520px) { .kilder li { grid-template-columns: 1fr; gap: 2px; } }

/* Foto-plass (lærerens egne bilder) */
.foto { margin: 0; }
.foto img { width: 100%; height: auto; border-radius: var(--r); display: block; }
.foto figcaption { font-size: var(--t-s); color: var(--blekk-2); margin-top: 8px; }

/* Les høyt */
.les-knapp[aria-pressed="true"] { background: var(--magenta); border-color: var(--magenta); color: #fff; }
.leses { background: color-mix(in srgb, var(--gul) 35%, transparent); outline: 4px solid color-mix(in srgb, var(--gul) 35%, transparent); border-radius: 2px; }

/* Ordliste */
.ordsok {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: var(--m5);
}
.ordsok input {
  flex: 1 1 280px;
  height: 48px;
  padding: 0 16px;
  border: 1.5px solid var(--blekk);
  border-radius: var(--r);
  background: var(--flate);
  font: inherit;
  font-size: 1.05rem;
  color: var(--blekk);
}
.ordsok input::placeholder { color: var(--blekk-3); }
.ordliste-tabell td:first-child { font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; white-space: nowrap; }
.ordliste-tabell td.nn, .ordliste-tabell td.en { font-family: var(--f-mono); font-size: 0.82rem; color: var(--blekk-2); white-space: nowrap; }

/* Utskrift */
@media print {
  .topp, .modul-side, .bunn, .modul-meta .knapper, .modul-slutt, .les-hoyt, .ovelse-fot { display: none !important; }
  body { background: #fff; color: #000; font-size: 11pt; }
  .modul-kropp { display: block; padding: 0; }
  .modul-topp { background: #fff; }
  .fig, .notat, .oppdrag, .ovelse, table { break-inside: avoid; }
  a { text-decoration: none; }
}

/* Figurer i quiz holdes små */
.quiz-sp .fig-flate { max-width: 560px; }

.fotogalleri { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: var(--m4); }
.fotogalleri img { aspect-ratio: 4 / 3; object-fit: cover; }

/* ------------------------------------------------------------------
   Verktøy: instrumentpaneler, skjema og kort
   ------------------------------------------------------------------ */

.vk {
  border: 1px solid var(--blekk);
  background: var(--flate);
  border-radius: var(--r);
  overflow: hidden;
}
.vk-hode {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px 16px;
  padding: 12px 18px;
  background: var(--blekk);
  color: var(--papir);
}
.vk-hode .etikett { font-size: 0.82rem; color: var(--papir); display: inline-flex; gap: 10px; align-items: center; }
.vk-hode .etikett::before { content: ""; width: 8px; height: 8px; background: var(--magenta); transform: rotate(45deg); }
.vk-hode .mono { font-size: 0.75rem; opacity: 0.75; }
.vk-kropp { padding: 18px; }
.vk-rad {
  display: grid;
  grid-template-columns: minmax(250px, 320px) minmax(0, 1fr);
  gap: 24px;
  align-items: start;
}
.vk-rad.bred { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
@media (max-width: 860px) { .vk-rad, .vk-rad.bred { grid-template-columns: 1fr; } }

.vk-faner { display: inline-flex; border: 1.5px solid var(--papir); border-radius: var(--r); overflow: hidden; }
.vk-faner button {
  border: 0;
  background: transparent;
  color: var(--papir);
  padding: 6px 14px;
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 0.9rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
}
.vk-faner button + button { border-left: 1.5px solid var(--papir); }
.vk-faner button[aria-pressed="true"] { background: var(--papir); color: var(--blekk); }

/* Skjemafelt */
.felter { display: grid; gap: 16px; }
.felt { display: grid; gap: 6px; }
.felt > label, .felt > .felt-navn {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 0.95rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--blekk-2);
}
.felt output, .felt .verdi {
  font-family: var(--f-mono);
  font-weight: 600;
  font-size: 0.95rem;
  text-transform: none;
  letter-spacing: 0;
  color: var(--blekk);
}
.felt small { font-size: 0.8rem; color: var(--blekk-3); line-height: 1.4; }
.felt input[type="text"], .felt input[type="number"], .felt input[type="date"], .felt input[type="time"], .felt select, .felt textarea {
  width: 100%;
  min-height: 42px;
  padding: 8px 12px;
  border: 1.5px solid var(--linje-2);
  border-radius: var(--r);
  background: var(--papir);
  color: var(--blekk);
  font: inherit;
  font-size: 1rem;
}
.felt textarea { min-height: 84px; resize: vertical; line-height: 1.45; }
.felt input:focus, .felt select:focus, .felt textarea:focus { border-color: var(--blekk); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--magenta) 25%, transparent); }
.felt-par { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 460px) { .felt-par { grid-template-columns: 1fr; } }

/* Glidebrytere */
input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 28px;
  background: transparent;
  cursor: pointer;
}
input[type="range"]::-webkit-slider-runnable-track { height: 4px; background: var(--linje-2); border-radius: 2px; }
input[type="range"]::-moz-range-track { height: 4px; background: var(--linje-2); border-radius: 2px; }
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px; height: 20px;
  margin-top: -8px;
  background: var(--flate);
  border: 3px solid var(--magenta);
  border-radius: 50%;
}
input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; background: var(--flate); border: 3px solid var(--magenta); border-radius: 50%; }
input[type="range"]:focus-visible { outline: 2px solid var(--magenta); outline-offset: 2px; }

.bryter { display: flex; gap: 10px; align-items: center; cursor: pointer; font-size: 0.95rem; }
.bryter input { width: 20px; height: 20px; accent-color: var(--magenta); }

.forhand { display: flex; flex-wrap: wrap; gap: 6px; }
.forhand button {
  border: 1px solid var(--linje-2);
  background: var(--papir);
  border-radius: 2px;
  padding: 5px 10px;
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 0.85rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  cursor: pointer;
  color: var(--blekk-2);
}
.forhand button:hover { border-color: var(--blekk); color: var(--blekk); }
.forhand button[aria-pressed="true"] { background: var(--blekk); color: var(--papir); border-color: var(--blekk); }

/* Tall og kriterier */
.tallrad {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 0;
  border-top: 2px solid var(--blekk);
}
.tallrad div { padding: 10px 12px 10px 0; border-bottom: 1px solid var(--linje); }
.tallrad span { display: block; font-family: var(--f-display); font-weight: 600; font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--blekk-3); }
.tallrad strong { display: block; font-family: var(--f-mono); font-size: 1.25rem; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
.tallrad strong.stor { font-family: var(--f-sjablong); font-size: 2rem; line-height: 1; letter-spacing: 0; }
.tallrad .fare strong { color: var(--babord); }

.kriterier { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.kriterier li {
  display: grid;
  grid-template-columns: 26px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid var(--linje);
  font-size: 0.92rem;
}
.kriterier .ikon {
  width: 22px; height: 22px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 0.8rem;
  color: #fff;
}
.kriterier .ok .ikon { background: var(--styrbord); }
.kriterier .ikke .ikon { background: var(--babord); }
.kriterier .mono { font-size: 0.82rem; color: var(--blekk-2); white-space: nowrap; }

.diagram { position: relative; }
.diagram svg { width: 100%; height: auto; overflow: visible; }
.diagram svg text { font-family: var(--f-mono); font-size: 11px; fill: var(--blekk-3); }
.diagram .tips {
  position: absolute;
  pointer-events: none;
  background: var(--blekk);
  color: var(--papir);
  border-radius: 2px;
  padding: 6px 10px;
  font-size: 0.8rem;
  line-height: 1.35;
  transform: translate(-50%, calc(-100% - 12px));
  white-space: nowrap;
  box-shadow: var(--skygge);
}
.diagram .tips strong { font-family: var(--f-mono); font-size: 0.95rem; }

.panel-tittel { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; margin: 18px 0 8px; }
.panel-tittel:first-child { margin-top: 0; }

.natt-flate { background: var(--natt); border-radius: var(--r); overflow: hidden; }
.natt-flate svg { width: 100%; height: auto; }

.svar-knapper { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.svar-knapper button {
  text-align: left;
  padding: 12px 14px;
  border: 1.5px solid var(--linje-2);
  border-radius: var(--r);
  background: var(--papir);
  cursor: pointer;
  font-weight: 700;
  line-height: 1.35;
}
.svar-knapper button:hover:not([disabled]) { border-color: var(--blekk); }
.svar-knapper button.riktig { border-color: var(--styrbord); background: var(--styrbord-flate); }
.svar-knapper button.feil { border-color: var(--babord); background: var(--babord-flate); }
.tilbakemelding { margin-top: 12px; font-size: var(--t-s); color: var(--blekk-2); min-height: 1.5em; max-width: 70ch; }
.tilbakemelding strong { color: var(--blekk); }
.poeng { font-family: var(--f-mono); font-size: 0.85rem; }

.les-av {
  font-family: var(--f-display);
  font-weight: 800;
  font-size: 2.2rem;
  line-height: 1;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

/* Artskort */
.artsfilter { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.artsrutenett { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.artskort {
  border: 1px solid var(--linje);
  border-radius: var(--r);
  background: var(--papir);
  overflow: hidden;
  display: grid;
  grid-template-rows: auto 1fr;
}
.artskort .plansje { background: var(--flate); border-bottom: 1px solid var(--linje); padding: 6px; }
.artskort .plansje svg { width: 100%; height: auto; }
.artskort .tekst { padding: 12px 14px 16px; display: grid; gap: 6px; align-content: start; }
.artskort h4 { font-size: 1.35rem; }
.artskort .latin { font-style: italic; font-size: 0.85rem; color: var(--blekk-3); }
.artskort ul { margin: 4px 0 0; padding-left: 1.1em; font-size: 0.9rem; line-height: 1.4; }
.artskort .redskap { font-family: var(--f-mono); font-size: 0.75rem; color: var(--blekk-2); margin-top: 4px; }

/* SJA-tabell */
.sja { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.sja th { text-align: left; font-family: var(--f-mono); font-weight: 500; font-size: 0.7rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--blekk-3); padding: 6px 6px 6px 0; border-bottom: 2px solid var(--blekk); }
.sja td { padding: 6px 6px 6px 0; border-bottom: 1px solid var(--linje); vertical-align: top; }
.sja input, .sja select, .sja textarea {
  width: 100%;
  min-width: 70px;
  padding: 6px 8px;
  border: 1px solid var(--linje-2);
  border-radius: 2px;
  background: var(--papir);
  color: var(--blekk);
  font: inherit;
  font-size: 0.9rem;
}
.sja textarea { min-height: 54px; resize: vertical; min-width: 150px; }
.risikotall {
  display: inline-grid;
  place-items: center;
  width: 38px; height: 32px;
  border-radius: 2px;
  font-family: var(--f-mono);
  font-weight: 600;
}
.risikotall.lav { background: var(--styrbord); color: #fff; }
.risikotall.mid { background: var(--gul); color: #1a1400; }
.risikotall.hoy { background: var(--babord); color: #fff; }
.sja .fjern { border: 0; background: transparent; cursor: pointer; font-size: 1.1rem; color: var(--blekk-3); padding: 4px 8px; }

/* MAYDAY-manus */
.manus {
  font-family: var(--f-mono);
  font-size: 1.02rem;
  line-height: 1.7;
  background: var(--natt);
  color: #e8eef2;
  padding: 18px 20px;
  border-radius: var(--r);
  white-space: pre-wrap;
  border-left: 6px solid var(--oransje);
}
.manus b { color: #ffb08a; font-weight: 600; }

/* Praksislogg */
.logg-liste { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 10px; }
.logg-liste li { border: 1px solid var(--linje); border-radius: var(--r); padding: 12px 14px; background: var(--papir); display: grid; gap: 4px; }
.logg-liste .logg-topp { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.logg-liste .logg-topp strong { font-family: var(--f-display); font-size: 1.15rem; }
.logg-liste .mono { font-size: 0.78rem; color: var(--blekk-3); }
.logg-liste p { font-size: 0.92rem; }
.logg-liste button { border: 0; background: transparent; color: var(--blekk-3); cursor: pointer; font-size: 0.85rem; text-decoration: underline; }

/* Lommekort i full størrelse */
.lk-stor { max-width: 760px; }
.lk-stor .lk-liste { list-style: none; margin: 0; padding: 0; counter-reset: lk; }
.lk-stor .lk-liste li { counter-increment: lk; border-bottom: 2px solid var(--linje); }
.lk-stor .lk-liste label {
  display: grid;

    var t = a[i]; a[i] = a[j]; a[j] = t;

    var t = document.createElement("textarea");
    t.value = tekst;
    t.setAttribute("readonly", "");

(function () {

  function gzDiagram(r, vinkel) {

    for (var v = minY; v <= maxY + 1e-6; v += 0.1) {
      var y = Y(v);
      s += '<line x1="' + ml + '" x2="' + (W - mr) + '" y1="' + y + '" y2="' + y + '" stroke="' + (Math.abs(v) < 1e-6 ? "var(--blekk-3)" : "var(--linje)") + '" stroke-width="1"/>';
      s += '<text x="' + (ml - 8) + '" y="' + (y + 4) + '" text-anchor="end">' + FF.tall(v, 1) + "</text>";
    }
    for (var g = 0; g <= 70; g += 10) s += '<text x="' + X(g) + '" y="' + (H - mb + 18) + '" text-anchor="middle">' + g + "°</text>";
    s += '<text x="' + (ml + (W - ml - mr) / 2) + '" y="' + (H - 6) + '" text-anchor="middle">KRENGNING</text>';
    s += '<text x="' + ml + '" y="14">GZ (m)</text>';
    // Areal (vask) og kurve
    var d = r.kurve.map(function (k, i) { return (i ? "L" : "M") + X(k.g).toFixed(1) + " " + Y(k.gz).toFixed(1); }).join(" ");
    s += '<path d="' + d + " L" + X(70) + " " + Y(0) + " L" + X(0) + " " + Y(0) + ' Z" fill="var(--magenta)" fill-opacity="0.1"/>';
    s += '<path d="' + d + '" fill="none" stroke="var(--magenta)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    // GM-tangent ved 57,3°
    // GM-tangenten: rett linje fra origo med stigning GM per radian, kuttet ved diagramkanten
    var gEnde = Math.min(57.3, 57.3 * maxY / Math.max(r.GM, 0.01));
    if (r.GM > 0) {
      s += '<line x1="' + X(0) + '" y1="' + Y(0) + '" x2="' + X(gEnde) + '" y2="' + Y(r.GM * gEnde / 57.3) + '" stroke="var(--blekk-3)" stroke-width="1" stroke-dasharray="4 4"/>';
      s += '<text x="' + (X(gEnde) - 6) + '" y="' + (Y(r.GM * gEnde / 57.3) + 4) + '" text-anchor="end">GM-tangent</text>';
    }
    // Dekkskant i vannet
    if (r.dekkVinkel != null) {
      s += '<line x1="' + X(r.dekkVinkel) + '" x2="' + X(r.dekkVinkel) + '" y1="' + mt + '" y2="' + (H - mb) + '" stroke="var(--oransje)" stroke-width="1"/>';
      s += '<text x="' + (X(r.dekkVinkel) + 5) + '" y="' + (H - mb - 8) + '" style="fill:var(--oransje-tekst)">dekkskant i vannet</text>';
    }
    // Valgt vinkel
    var kv = r.kurve[Math.min(70, Math.round(vinkel))];
    s += '<circle cx="' + X(kv.g) + '" cy="' + Y(kv.gz) + '" r="5" fill="var(--magenta)" stroke="var(--flate)" stroke-width="2"/>';
    s += '<line class="kryss" x1="0" x2="0" y1="' + mt + '" y2="' + (H - mb) + '" stroke="var(--blekk)" stroke-width="1" visibility="hidden"/>';
    s += '<rect class="treff" x="' + ml + '" y="' + mt + '" width="' + (W - ml - mr) + '" height="' + (H - mt - mb) + '" fill="transparent"/>';
    s += "</svg>";
    return { svg: s, X: X, Y: Y, W: W, ml: ml, mr: mr };
  }
