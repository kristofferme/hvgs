:root {

  --ui-bg: color-mix(in srgb, var(--bg-2) 80%, transparent);

  --ui-hover: color-mix(in srgb, var(--ink) 9%, transparent);

}

.k-lerret-svg { position: absolute; overflow: visible; pointer-events: none; --iz: 1; }

/* ==========================================================================

   ========================================================================== */

.k-frame {
  --a: var(--a1);
  --hl: color-mix(in srgb, var(--a) 38%, transparent);
  --rad: 40px;
  position: absolute;
  left: 0;
  top: 0;
  transform-origin: 0 0;
  box-sizing: border-box;
  display: flex;

.k-skisse path { fill: none; stroke: color-mix(in srgb, var(--ink) 82%, transparent); stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 0; }

  border: 3px solid var(--a);
  box-shadow: 0 0 46px color-mix(in srgb, var(--a) 55%, transparent), inset 0 0 70px color-mix(in srgb, var(--a) 20%, transparent);

  --hl: color-mix(in srgb, #ffffff 45%, transparent);
  background: linear-gradient(170deg, color-mix(in srgb, var(--lapp-bg, var(--a1)) 100%, #fff 0%), color-mix(in srgb, var(--lapp-bg, var(--a1)) 88%, #000 12%));

/* Fokus: når vi står i en ramme, trer resten tilbake */
.k-root.k-fokus .k-frame:not(.k-aktiv) { opacity: 0.3; }
.k-root.k-editing .k-frame, .k-root.k-oversikt .k-frame { opacity: 1 !important; }

/* --- Innhold --- */
.k-inner { display: flex; flex-direction: column; gap: 0.5em; width: 100%; min-width: 0; }
.k-frame h1, .k-frame h2, .k-frame p, .k-frame ul, .k-frame ol, .k-frame figure, .k-frame blockquote { margin: 0; }
.k-frame h1, .k-frame h2 {
  font-family: var(--f-disp);
  font-weight: var(--disp-w);
  font-style: var(--disp-stil);
  letter-spacing: var(--disp-spor);
  text-transform: var(--disp-case);
  text-wrap: balance;
  font-optical-sizing: auto;
}
.k-frame h1 { font-size: var(--h1); line-height: 1.02; }
.k-frame h2 { font-size: calc(var(--h1) * 0.6); line-height: 1.08; }
.k-frame p { color: var(--ink-2); text-wrap: pretty; }
.k-frame strong { color: var(--ink); font-weight: 750; }
.k-frame em { font-style: italic; }

.k-frame code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.86em; padding: 0.06em 0.3em; border-radius: 0.25em; background: var(--line); }

.k-frame ul, .k-frame ol { padding-left: 1.15em; display: flex; flex-direction: column; gap: 0.32em; color: var(--ink-2); }
.k-frame li::marker { color: var(--a); font-weight: 800; }
.k-stat { display: flex; flex-direction: column; gap: 0.1em; }

  font-family: var(--f-disp);
  font-size: 4.4em;
  font-weight: var(--disp-w);
  font-style: var(--disp-stil);
  line-height: 0.95;
  letter-spacing: -0.03em;
  background: linear-gradient(115deg, var(--a), var(--a2));

  background-clip: text;
  color: transparent;
  font-variant-numeric: tabular-nums;
  padding-bottom: 0.05em;
}

.k-cap { font-size: 0.8em; color: var(--ink-2); }

.k-frame mark { color: inherit; padding: 0 0.06em; background: linear-gradient(transparent 56%, var(--hl) 56%, var(--hl) 94%, transparent 94%) no-repeat 0 0 / 100% 100%; }
.k-ikon { font-size: 3.2em; line-height: 1; }
.k-cols { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 1.4em; align-items: start; }
.k-col { display: flex; flex-direction: column; gap: 0.5em; min-width: 0; }
.k-frame hr { border: 0; height: 0.06em; background: var(--line); width: 100%; margin: 0.15em 0; }
.k-img-ramme { overflow: hidden; border-radius: 0.5em; }
.k-img img, .k-img video { display: block; max-width: 100%; max-height: 12em; margin: 0 auto; object-fit: contain; -webkit-user-drag: none; }
.k-form-fri .k-img img, .k-form-fri .k-img video { max-height: none; width: 100%; }
.k-img figcaption { font-size: 0.55em; color: var(--ink-2); margin-top: 0.6em; text-align: center; }
.k-tom .k-inner::before { content: "Tom ramme – dobbeltklikk for å skrive"; color: var(--ink-2); opacity: 0.55; font-size: 0.7em; }

/* Håndtegnede markeringer */
.k-u, .k-ring, .k-stryk { position: relative; display: inline-block; }
.k-ann { position: absolute; overflow: visible; pointer-events: none; }
.k-ann path { fill: none; stroke: var(--a); stroke-linecap: round; vector-effect: non-scaling-stroke; }
.k-u .k-ann { left: -2%; width: 104%; bottom: -0.16em; height: 0.3em; }
.k-u .k-ann path { stroke-width: 5; }
.k-ring .k-ann { left: -10%; top: -22%; width: 120%; height: 144%; }
.k-ring .k-ann path { stroke-width: 4.5; }
.k-stryk .k-ann { left: -3%; top: 38%; width: 106%; height: 0.25em; }
.k-stryk .k-ann path { stroke-width: 5.5; stroke: color-mix(in srgb, var(--a) 85%, var(--ink)); }
.k-stryk { color: color-mix(in srgb, currentColor 65%, transparent); }

/* Ord som skifter */
.k-roter { display: inline-grid; vertical-align: bottom; overflow: hidden; padding-bottom: 0.08em; margin-bottom: -0.08em; }
.k-ro { grid-area: 1 / 1; opacity: 0; transform: translateY(100%); color: var(--a); transition: transform 0.7s var(--ease-ut), opacity 0.5s ease; white-space: nowrap; }
.k-ro.k-pa { opacity: 1; transform: none; }
.k-ro.k-ut { opacity: 0; transform: translateY(-100%); }

.k-stolpe { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 2fr) auto; align-items: center; gap: 0.6em; font-size: 0.82em; }
.k-st-navn { color: var(--ink); font-weight: 650; text-align: left; }

.k-st-spor i { display: block; height: 100%; width: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--a), var(--a2)); transform-origin: 0 50%; transform: scaleX(var(--v)); }
.k-st-tall { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--ink); min-width: 3.2em; text-align: right; }

/* Prosess */
.k-flyt { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35em 0.2em; }
.k-fl-steg { display: inline-flex; align-items: center; gap: 0.45em; padding: 0.45em 0.8em 0.45em 0.45em; border-radius: 99px; background: color-mix(in srgb, var(--a) 14%, transparent); border: 2px solid color-mix(in srgb, var(--a) 40%, transparent); font-weight: 650; font-size: 0.85em; }
.k-fl-nr { display: grid; place-items: center; width: 1.6em; height: 1.6em; border-radius: 50%; background: var(--a); color: var(--a-ink); font-weight: 800; font-size: 0.8em; flex: none; }
.k-rs-lapp .k-fl-nr { color: var(--lapp-bg, var(--a1)); }
.k-fl-pil { width: 1.5em; height: 0.6em; overflow: visible; flex: none; }
.k-fl-pil path { fill: none; stroke: var(--a); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 0; }

/* Redigering direkte i rammen */
.k-skriver {
  outline: 3px dashed color-mix(in srgb, var(--a) 80%, transparent);
  outline-offset: 0.18em;
  border-radius: 0.08em;
  cursor: text;
  user-select: text;
  -webkit-user-select: text;
  white-space: pre-wrap;
  caret-color: var(--a);
}
.k-skriver * { user-select: text; -webkit-user-select: text; }
.k-root.k-editing .k-frame.k-valgt [data-l] { cursor: text; }

/* ==========================================================================
   Animasjon: hvordan innholdet kommer inn når kameraet lander

   ========================================================================== */

.k-w, .k-wi, .k-c { display: inline-block; }

/* --- Ord for ord --- */

/* --- Bokstav for bokstav --- */
.k-aktiv.k-inn-bokstav .k-b:not(.k-tittel) { animation: k-rise 1s var(--ease-ut) both; animation-delay: calc(var(--i, 0) * 95ms + 300ms); }
.k-aktiv.k-inn-bokstav .k-c { animation: k-bokstav 0.8s var(--ease-sprett) both; animation-delay: calc(var(--i, 0) * 95ms + var(--c, 0) * 26ms); }

/* --- Skrivemaskin --- */
.k-aktiv.k-inn-skriv .k-b:not(.k-tittel) { animation: k-fade 0.8s ease both; animation-delay: calc(var(--i, 0) * 150ms + 700ms); }
.k-aktiv.k-inn-skriv .k-c { animation: k-skriv 0.01s steps(1) both; animation-delay: calc(var(--i, 0) * 60ms + var(--c, 0) * 42ms + 120ms); }

  content: "";
  display: inline-block;
  width: 0.06em;
  height: 0.85em;
  margin-left: 0.08em;
  vertical-align: -0.04em;
  background: var(--a);

/* --- Dekode (bokstavene rulles av skriptet) --- */
.k-aktiv.k-inn-dekode .k-b:not(.k-tittel) { animation: k-rise 0.9s var(--ease-ut) both; animation-delay: calc(var(--i, 0) * 95ms + 250ms); }

/* --- Maske: linjene glir opp bak en kant --- */
.k-inn-maske .k-w { overflow: hidden; vertical-align: bottom; padding: 0 0.05em 0.14em; margin: 0 -0.05em -0.14em; }
.k-aktiv.k-inn-maske .k-wi { animation: k-maske-opp 1.05s cubic-bezier(0.7, 0, 0.2, 1) both; animation-delay: calc(var(--i, 0) * 95ms + var(--w, 0) * 65ms); }
.k-aktiv.k-inn-maske .k-b:not(.k-tittel) { animation: k-maske 1.1s cubic-bezier(0.7, 0, 0.2, 1) both; animation-delay: calc(var(--i, 0) * 110ms + 200ms); }

/* --- Uskarp til skarp --- */
.k-aktiv.k-inn-blur .k-b { animation: k-blur 1.5s cubic-bezier(0.3, 0.6, 0.2, 1) both; animation-delay: calc(var(--i, 0) * 130ms + 60ms); }

/* --- Zoom --- */
.k-aktiv.k-inn-zoom .k-b { animation: k-zoom 0.9s var(--ease-sprett) both; animation-delay: calc(var(--i, 0) * 100ms + 60ms); }

/* --- Sveip --- */
.k-aktiv.k-inn-sveip .k-b { animation: k-sveip 1s cubic-bezier(0.75, 0, 0.2, 1) both; animation-delay: calc(var(--i, 0) * 110ms + 60ms); }

/* --- Fall --- */
.k-aktiv.k-inn-fall .k-b:not(.k-tittel) { animation: k-fall 1s var(--ease-sprett) both; animation-delay: calc(var(--i, 0) * 110ms + 250ms); }
.k-aktiv.k-inn-fall .k-wi { animation: k-fall 0.9s var(--ease-sprett) both; animation-delay: calc(var(--i, 0) * 95ms + var(--w, 0) * 85ms); }

/* --- Felles for alle typer --- */
.k-aktiv:not(.k-inn-ingen) mark { animation: k-mark 0.9s cubic-bezier(0.65, 0, 0.2, 1) both; animation-delay: calc(var(--i, 0) * 95ms + 750ms); }
.k-aktiv:not(.k-inn-ingen) .k-ann { animation: k-avdekk 0.75s cubic-bezier(0.6, 0, 0.3, 1) both; animation-delay: calc(var(--i, 0) * 95ms + 950ms); }
.k-aktiv:not(.k-inn-ingen) .k-num { animation: k-pop 1.1s cubic-bezier(0.2, 0.9, 0.2, 1.15) both; animation-delay: calc(var(--i, 0) * 95ms + 120ms); }
.k-aktiv:not(.k-inn-ingen) .k-skisse path { animation: k-tegn 1.5s cubic-bezier(0.5, 0, 0.3, 1) both; }
.k-aktiv:not(.k-inn-ingen) .k-stolpe:not(.k-steg) .k-st-spor i,
.k-aktiv:not(.k-inn-ingen) .k-stolpe.k-vis .k-st-spor i { animation: k-vokse 1.3s var(--ease-ut) both; animation-delay: calc(var(--i, 0) * 95ms + var(--j, 0) * 130ms + 250ms); }
.k-aktiv:not(.k-inn-ingen) .k-fl-steg:not(.k-steg) { animation: k-pop 0.65s var(--ease-sprett) both; animation-delay: calc(var(--i, 0) * 95ms + var(--j, 0) * 280ms + 200ms); }
.k-aktiv:not(.k-inn-ingen) .k-fl-pil path { animation: k-tegn 0.45s ease both; animation-delay: calc(var(--i, 0) * 95ms + var(--j, 0) * 280ms + 60ms); }
.k-aktiv:not(.k-inn-ingen) .k-img img, .k-aktiv:not(.k-inn-ingen) .k-img video { animation: k-ken 14s cubic-bezier(0.2, 0.6, 0.3, 1) both; }
.k-aktiv:not(.k-inn-ingen) .k-ikon { animation: k-ikon 1.1s var(--ease-sprett) both; animation-delay: calc(var(--i, 0) * 95ms + 60ms); }
.k-aktiv:not(.k-inn-ingen) blockquote::before { animation: k-pop 0.9s var(--ease-sprett) both; }

/* Koblinger tegner seg selv */
.k-kobling.k-tegn .k-kob-linje { animation: k-tegn 1.1s cubic-bezier(0.6, 0, 0.3, 1) both 0.35s; }

/* Steg for steg */
.k-steg { transition: opacity 0.55s ease, transform 0.55s var(--ease-ut), filter 0.55s ease; }
.k-root:not(.k-editing):not(.k-oversikt) .k-maal .k-steg:not(.k-vis),

/* I redigering står alt stille, unntatt når du forhåndsviser */
.k-root.k-editing .k-frame:not(.k-forhand) *,
.k-root.k-editing .k-frame:not(.k-forhand)::before,
.k-root.k-editing .k-frame:not(.k-forhand) *::after,

.k-mal-vindu * { animation: none !important; transition: none !important; }

@keyframes k-rise { from { opacity: 0; transform: translateY(0.55em); filter: blur(10px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes k-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes k-ord { from { opacity: 0; transform: translateY(0.55em) rotate(3deg); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes k-bokstav { from { opacity: 0; transform: translateY(0.7em) rotate(12deg) scale(0.5); } to { opacity: 1; transform: none; } }
@keyframes k-skriv { from { opacity: 0; } to { opacity: 1; } }
@keyframes k-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
@keyframes k-maske-opp { from { transform: translateY(115%); } to { transform: none; } }
@keyframes k-maske { from { clip-path: inset(0 0 100% 0); transform: translateY(0.6em); } to { clip-path: inset(-20% -5% -20% -5%); transform: none; } }
@keyframes k-blur { from { opacity: 0; filter: blur(26px); transform: scale(1.06); } to { opacity: 1; filter: none; transform: none; } }
@keyframes k-zoom { from { opacity: 0; transform: scale(0.55); } to { opacity: 1; transform: none; } }
@keyframes k-sveip { from { clip-path: inset(-10% 100% -10% -5%); transform: translateX(-0.4em); } to { clip-path: inset(-10% -5% -10% -5%); transform: none; } }
@keyframes k-fall { 0% { opacity: 0; transform: translateY(-1.3em) rotate(-5deg); } 60% { opacity: 1; } 100% { opacity: 1; transform: none; } }
@keyframes k-mark { from { background-size: 0% 100%; } to { background-size: 100% 100%; } }
@keyframes k-tegn { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes k-avdekk { from { clip-path: inset(-30% 100% -30% -10%); } to { clip-path: inset(-30% -10% -30% -10%); } }
@keyframes k-pop { from { opacity: 0; transform: scale(0.6); filter: blur(10px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes k-vokse { from { transform: scaleX(0); } }
@keyframes k-ken { from { transform: scale(1.1); } to { transform: scale(1); } }

}

/* ==========================================================================
   Grensesnitt – farger arves fra presentasjonens palett
   ========================================================================== */

.k-ui { position: absolute; inset: 0; pointer-events: none; z-index: 10; font-family: var(--f-ui); color: var(--ui-ink); }
.k-ui > * { pointer-events: auto; }
.k-ui button, .k-ui input, .k-ui textarea { font: inherit; color: inherit; }
.k-ui :focus-visible { outline: 2px solid var(--ui-accent); outline-offset: 2px; }

.k-glass {
  background: var(--ui-bg);
  border: 1px solid var(--ui-line);
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
}

.k-progress { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; pointer-events: none; }
.k-progress i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--a1), var(--a2)); transition: width 0.9s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 12px var(--a1); }

.k-dock, .k-verktoy, .k-panel, .k-popover, .k-toast, .k-tilbake, .k-notater {
  background: var(--ui-bg);
  border: 1px solid var(--ui-line);
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
}

.k-dock {
  position: absolute;
  left: 50%;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 6px;
  border-radius: 18px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
  transition: opacity 0.4s ease, transform 0.4s var(--ease-ut), left 0.4s var(--ease-ut);
  max-width: calc(100vw - 32px);
  overflow-x: auto;
  scrollbar-width: none;
}
.k-dock::-webkit-scrollbar { display: none; }
@media (min-width: 721px) { .k-root.k-editing:not(.k-panel-skjult) .k-dock { left: calc(50% - 186px); max-width: calc(100vw - 420px); } }
.k-root.k-skjul-ui:not(.k-editing) .k-dock { opacity: 0; transform: translate(-50%, 12px); pointer-events: none; }
.k-sep { width: 1px; height: 24px; background: var(--ui-line); margin: 0 4px; flex: none; }

.k-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 38px;
  padding: 0 11px;
  border: 0;
  border-radius: 12px;
  background: transparent;
  cursor: pointer;
  font-size: 13.5px;
  font-weight: 650;
  white-space: nowrap;
  flex: none;
  transition: background 0.15s ease, transform 0.15s ease;
}
.k-btn:hover { background: var(--ui-hover); }
.k-btn:active { transform: scale(0.96); }
.k-btn svg { width: 19px; height: 19px; flex: none; }
.k-btn.k-ikon-knapp { padding: 0; width: 38px; justify-content: center; }
.k-btn.k-primar { background: var(--ui-accent); color: var(--ui-accent-ink); }
.k-btn.k-primar:hover { filter: brightness(1.08); background: var(--ui-accent); }
.k-btn.k-primar-lys { background: color-mix(in srgb, var(--ui-accent) 18%, transparent); color: var(--ui-ink); }
.k-btn.k-fare:hover { background: rgba(255, 80, 80, 0.18); color: #ff8080; }
.k-btn.k-pa-knapp, .k-btn.k-aktiv-knapp { background: color-mix(in srgb, var(--ui-accent) 22%, transparent); }
.k-btn[disabled] { opacity: 0.35; pointer-events: none; }
.k-btn.k-ulagret::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ui-accent); margin-left: -2px; }
.k-teller-ui { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ui-ink-2); padding: 0 6px; min-width: 54px; text-align: center; }

.k-tilbake {
  position: absolute;
  top: calc(16px + env(safe-area-inset-top, 0px));
  left: 50%;
  transform: translateX(-50%);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
.k-root.k-fri-visning:not(.k-editing) .k-tilbake { opacity: 1; pointer-events: auto; }

/* --- Verktøylinje ved valgt ramme --- */
.k-verktoy {
  position: absolute;
  left: 0;
  top: 0;
  display: none;
  align-items: center;
  gap: 2px;
  padding: 5px;
  border-radius: 15px;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.3);
  z-index: 3;
}
.k-root.k-editing .k-verktoy.k-pa { display: flex; animation: k-ui-inn 0.25s var(--ease-ut) both; }
.k-root.k-drar .k-verktoy { opacity: 0; pointer-events: none; }
.k-verktoy .k-btn { height: 34px; }
.k-verktoy .k-btn.k-ikon-knapp { width: 34px; }
.k-kob-input { width: 180px; height: 32px; box-sizing: border-box; border-radius: 9px; border: 1px solid var(--ui-line); background: var(--ui-hover); padding: 0 10px; font-size: 13.5px; }
@keyframes k-ui-inn { from { opacity: 0; transform: translateY(6px) scale(0.98); } }

/* --- Popover --- */
.k-popover {
  position: absolute;
  left: 0;
  top: 0;
  display: none;
  padding: 10px;
  border-radius: 16px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.38);
  max-width: min(440px, calc(100vw - 24px));
  max-height: calc(100vh - 24px);
  overflow-y: auto;
  z-index: 20;
  background: var(--ui-solid);
}
.k-popover.k-pa { display: block; animation: k-ui-inn 0.22s var(--ease-ut) both; }
.k-valg { display: flex; flex-wrap: wrap; gap: 6px; }
.k-valg-liste { flex-direction: column; align-items: stretch; min-width: 220px; }
.k-valg-liste .k-btn { justify-content: flex-start; }
.k-chip {
  border: 1px solid var(--ui-line);
  background: var(--ui-hover);
  border-radius: 99px;
  padding: 7px 13px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 650;
  line-height: 1.2;
  transition: background 0.15s ease, border-color 0.15s ease;
}
.k-chip:hover { border-color: color-mix(in srgb, var(--ui-accent) 60%, transparent); }
.k-chip.k-pa { background: var(--ui-accent); color: var(--ui-accent-ink); border-color: transparent; }
.k-fargepanel { display: flex; flex-direction: column; gap: 10px; min-width: 300px; }

.k-maler { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: min(520px, calc(100vw - 44px)); }
.k-mal {
  border: 1px solid var(--ui-line);
  background: var(--ui-hover);
  border-radius: 12px;
  padding: 6px 6px 8px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 12.5px;
  font-weight: 700;
  transition: transform 0.15s ease, border-color 0.15s ease;
}
.k-mal:hover { transform: translateY(-2px); border-color: var(--ui-accent); }
.k-mal-vindu {
  position: relative;
  height: 92px;
  border-radius: 8px;
  overflow: hidden;
  background: radial-gradient(120% 120% at 40% 30%, var(--bg-2), var(--bg));
  display: grid;
  place-items: center;
  color: var(--ui-ink-2);
}
.k-mal-vindu > .k-frame { position: absolute; transform-origin: 50% 50%; opacity: 1 !important; }
.k-mal-vindu > svg { width: 30px; height: 30px; }

/* --- Panel --- */
.k-panel {
  position: absolute;
  top: calc(12px + env(safe-area-inset-top, 0px));
  right: calc(12px + env(safe-area-inset-right, 0px));
  bottom: calc(80px + env(safe-area-inset-bottom, 0px));
  width: 340px;
  display: flex;
  flex-direction: column;
  border-radius: 20px;
  box-shadow: 0 30px 70px rgba(0, 0, 0, 0.35);
  transform: translateX(calc(100% + 40px));
  transition: transform 0.45s var(--ease-ut);
  overflow: hidden;
  user-select: text;
  -webkit-user-select: text;
  touch-action: auto;
  background: color-mix(in srgb, var(--ui-solid) 90%, transparent);
}
.k-root.k-editing:not(.k-panel-skjult) .k-panel { transform: none; }
.k-panel-hode { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 14px 10px 18px; border-bottom: 1px solid var(--ui-line); }
.k-panel-hode h3 { margin: 0; font-size: 15px; font-weight: 800; }
.k-panel-hode small { display: block; font-size: 11.5px; color: var(--ui-ink-2); font-weight: 600; margin-top: 2px; }
.k-panel-kropp { flex: 1; overflow-y: auto; padding: 14px 18px 22px; display: flex; flex-direction: column; gap: 16px; overscroll-behavior: contain; }
.k-felt { display: flex; flex-direction: column; gap: 7px; }
.k-felt > label, .k-etikett { font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em; font-weight: 800; color: var(--ui-ink-2); }
.k-stabel { display: flex; flex-direction: column; gap: 10px; }
.k-panel textarea, .k-panel input[type="text"] {
  width: 100%;
  box-sizing: border-box;
  border-radius: 12px;
  border: 1px solid var(--ui-line);
  background: color-mix(in srgb, var(--bg) 40%, transparent);
  font: 14px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  padding: 10px 12px;
  resize: vertical;
}
.k-panel input[type="text"] { font-family: var(--f-ui); font-size: 15px; font-weight: 650; }
.k-panel textarea:focus, .k-panel input:focus, .k-kob-input:focus { outline: 2px solid var(--ui-accent); outline-offset: -1px; border-color: transparent; }
.k-hint { font-size: 12px; line-height: 1.6; color: var(--ui-ink-2); }
.k-hint code { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; padding: 1px 5px; border-radius: 5px; background: var(--ui-hover); color: var(--ui-ink); white-space: nowrap; }
.k-hint b { color: var(--ui-ink); }
.k-seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 12px; background: var(--ui-hover); }
.k-seg button { border: 0; background: transparent; padding: 7px 10px; border-radius: 9px; cursor: pointer; font-size: 13px; font-weight: 700; color: var(--ui-ink-2); }
.k-seg button[aria-pressed="true"] { background: var(--ui-solid); color: var(--ui-ink); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18); }
.k-seg-liten { margin-right: 4px; }
.k-farger { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
.k-farger button { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25); }
.k-farger button[aria-pressed="true"] { border-color: var(--ui-ink); }
.k-farger .k-auto { background: conic-gradient(var(--a1), var(--a2), var(--a3), var(--a1)); }
.k-farger input[type="color"], .k-egen-farge input { width: 28px; height: 28px; border: 0; padding: 0; background: none; cursor: pointer; }
.k-bryter { display: flex; align-items: center; gap: 10px; font-size: 13.5px; font-weight: 650; cursor: pointer; line-height: 1.35; }
.k-bryter input { width: 18px; height: 18px; accent-color: var(--ui-accent); flex: none; }
.k-knapperad { display: flex; flex-wrap: wrap; gap: 6px; }
.k-knapperad .k-btn { background: var(--ui-hover); height: 34px; font-size: 13px; }
.k-knapperad .k-btn.k-primar { background: var(--ui-accent); }
.k-glider { width: 100%; accent-color: var(--ui-accent); }
.k-detaljer summary, .k-seksjon summary { cursor: pointer; font-size: 12.5px; font-weight: 750; color: var(--ui-ink-2); }
.k-detaljer[open] summary { margin-bottom: 8px; }
.k-seksjon { border-top: 1px solid var(--ui-line); padding-top: 12px; }
.k-seksjon summary { font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em; font-weight: 800; list-style-position: outside; }
.k-seksjon-kropp { padding-top: 10px; }

.k-stilkort {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 12px 12px 14px;
  border-radius: 14px;
  background: linear-gradient(120deg, color-mix(in srgb, var(--a1) 18%, transparent), color-mix(in srgb, var(--a2) 14%, transparent));

      setTimeout(function () { gaTil(0, { type: 'fly', fly: { varighet: reduser ? 200 : 2600, ease: 'quint' } }); }, 380);
    } else {
      var o2 = oversiktsVisning(); cam.x = o2.x; cam.y = o2.y; cam.z = o2.z; cam.r = 0;
      veksleRedigering(true);
    }
    requestAnimationFrame(lokke);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(tilpassAlle);
    setTimeout(tilpassAlle, 1500);

    var utkast = null;
    try { utkast = JSON.parse(lager.get(UTKAST) || 'null'); } catch (e) { utkast = null; }
    if (utkast && utkast.doc && JSON.stringify(normaliser(utkast.doc)) !== JSON.stringify(doc)) {
      var tid = new Date(utkast.tid).toLocaleString('no', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
      toast('Du har ulagrede endringer fra ' + tid + '.', [
        { tekst: 'Hent dem tilbake', primar: true, fn: function () { historikk.push(JSON.stringify(doc)); settDoc(JSON.stringify(utkast.doc)); veksleRedigering(true); } },
        { tekst: 'Forkast', fn: function () { lager.del(UTKAST); } }
      ], 0);
    } else if (doc.sti.length && !lager.get('krizi-sett-hjelp-2')) {
      setTimeout(function () { toast(W < 700 ? 'Trykk eller sveip for neste · snu telefonen for større tekst' : '→ eller mellomrom for neste · O for oversikt · E for å redigere'); }, 3000);
      lager.set('krizi-sett-hjelp-2', '1');
    }
    aktivitet();
  }

  window.krizi = {
    neste: neste, forrige: forrige, gaTil: gaTil, rediger: veksleRedigering, oversikt: visOversikt,
    doc: function () { return doc; }, html: somHTML, versjon: VERSJON, stil: function () { return aktivStil(); },
    terning: terning, velg: velg, forhandsvis: forhandsvis,
    brukMal: function (navn) { var m = finnMal(navn); if (!m) return false; doc.stil = stilFraMal(m, doc.stil.seed); brukStil(); byggVerden(); return true; },
    maler: function () { return STILER.map(function (m) { return m.navn; }); }
  };
  start();
})();
</script>
</body>
</html>
